name: Release

# release-please lê os Conventional Commits e abre PR de release
# (version bump + CHANGELOG). Ao mergear o PR, ele cria a tag e a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
