, derruba voador, impede escavação e amplia a torradeira.`,sin:`com Mariposa: ela fica boba na luz. Com Estilingue: mira melhor.`},ima:{nome:`Ímã de Geladeira`,cost:60,cd:9,hp:70,unlock:!0,desc:`Puxa sozinho a sucata do chão em volta. Não deixa nada pro fantasma.`,sin:`com Boia: a sucata chega sem clique. Preguiça é progresso.`},radio:{nome:`Rádio Velho`,cost:95,cd:11,hp:85,unlock:!0,desc:`Hipnotiza um bicho por 2s. O Seu Bento só riu. Combina com o ventilador.`,sin:`dois Rádios no corredor = hipnose em área (Rádio-Duet). Redireciona o Pescador.`},estilingue:{nome:`Estilingue`,cost:110,cd:7,hp:100,unlock:!1,desc:`Atira lata, dano alto, recarga lenta. Silencioso: acerta fantasma e lata sem levar troco.`,sin:`com Holofote: alcance maior. Com Espelho: risca o tiro.`},aspirador:{nome:`Aspirador Hidráulico`,cost:100,cd:9,hp:110,unlock:!1,desc:`Puxa bichos pequenos pra trás. Não empurra: atrai. É um aspirador com pernas.`,sin:`com Bujão: puxa pra cima da bomba. Com Batedeira: segura no liquidificador.`},batedeira:{nome:`Batedeira Velha`,cost:90,cd:7,hp:120,unlock:!1,desc:`Duas facas girando. Dano em área curta. Corpo a corpo: a lata não devolve faca.`,sin:`com Aspirador: junta e tritura. Com Bujão: pica e explode.`},espelho:{nome:`Espelho`,cost:80,cd:8,hp:100,unlock:!1,desc:`Devolve o que o Peixe-Lata mandou de volta. Ninguém sabe de onde veio.`,sin:`com Geladeira: reflexo duplo. Com Estilingue: o tiro passa limpo.`},pneu:{nome:`Pneu Queimado`,cost:70,cd:12,hp:200,unlock:!1,desc:`Barreira que pega fogo devagar. Barra pouco, queima muito. Fumaça atrapalha todo mundo.`,sin:`com Ventilador: fogo soprado pra frente. Chuva apaga por 6s.`},aranha:{nome:`Aranha-de-Encanamento`,cost:140,cd:14,hp:70,unlock:!1,desc:`Não fica numa coluna: atira em TODAS as colunas do corredor. Cara, frágil, pernuda.`,sin:`com Bujão: cobre os buracos. Com Holofote: acerta o que ninguém vê.`},geladeira_bomba:{nome:`Geladeira-Bomba`,cost:130,cd:16,hp:320,unlock:!1,desc:`É uma geladeira. Também é uma bomba. Quando quebra, divide o prejuízo.`,sin:`com Geladeira: segura mais. Com Pneu: fogo + estilhaço.`},cachorro:{nome:`Cachorro-de-Guarda`,cost:45,cd:8,hp:90,unlock:!1,desc:`É um balde com coleira. Late e empurra bicho pequeno. O Zé insiste que é cachorro.`,sin:`com Rádio: o latido redireciona o Pescador. Com qualquer coisa: constrange.`},coisa_ze:{nome:`Coisa do Zé`,cost:0,cd:0,hp:140,unlock:!1,special:!0,desc:`O Zé monta uma vez por partida. Ele escolhe. Você aceita. Ninguém sabe o que vem.`,sin:`com você: paciência.`},remover:{nome:`Pé de Cabra`,cost:0,cd:0,hp:0,unlock:!0,desc:`Arranca uma engenhoca. Devolve 25% em sucata. Não machuca ninguém, infelizmente.`,sin:`com o Zé: discussão.`}},shopBase:[`boia`,`torradeira`,`ventilador`,`geladeira`,`bujao`,`holofote`,`ima`,`radio`,`remover`],machOrder:[`boia`,`torradeira`,`lancador_lata`,`ventilador`,`geladeira`,`bujao`,`holofote`,`ima`,`radio`,`estilingue`,`aspirador`,`batedeira`,`espelho`,`pneu`,`aranha`,`geladeira_bomba`,`cachorro`,`coisa_ze`,`remover`],upgrades:{boia:[`rede dupla`,`hélice de lata`,`antena de cobre`],torradeira:[`fita isolante`,`torrada dupla`,`resistor de fogão`],lancador_lata:[`mola reforçada`,`cano duplo`,`lata incendiária`],ventilador:[`hélices duplas`,`motor de liquidificador`,`vento de furacão`],geladeira:[`ímã extra`,`porta reforçada`,`isopor por dentro`],bujao:[`fita e arame`,`registro aberto`,`bujão extra`],holofote:[`lâmpada nova`,`refletor de lata`,`fio direto no poste`],ima:[`ímã de geladeira`,`eletroímã de porta`,`bobina do transformador`],radio:[`antena de arame`,`alto-falante novo`,`fita do Zé`],estilingue:[`elástico de caminhão`,`munição de parafuso`,`forquilha de cano`],aspirador:[`saco novo`,`motor de oficina`,`segunda boca`],batedeira:[`facas de serra`,`motor trifásico`,`terceira faca`],espelho:[`moldura de janela`,`dois espelhos`,`espelho de farol`],pneu:[`mais borracha`,`gasolina velha`,`pilha de pneu`],aranha:[`cano mais longo`,`mais pernas`,`segunda aranha`],geladeira_bomba:[`fita vermelha`,`segundo pavio`,`duas geladeiras`],cachorro:[`segunda coleira`,`latinho novo`,`osso de borracha`],coisa_ze:[`mais coisa`,`mais Zé`,`não olha dentro`],remover:[`fita na empunhadura`,`cabo maior`,`nada. é um pé de cabra.`]},enemy:{baiacu:{nome:`Baiacu de Tampinha`,hp:90,speed:22,dps:25,scrap:10,r:22,desc:`Três olhos que piscam em ordem. Espinhos de tampinha de garrafa. Veio remando de barriga.`,hint:`Dano direto. Ele é o básico.`},enguia:{nome:`Enguia de Óleo`,hp:60,speed:52,dps:18,scrap:10,r:18,desc:`Escorregadia, mergulha, some. Deixa uma mancha preta em forma de má notícia.`,hint:`Torradeira não pega enquanto mergulha. Holofote acende e resolve.`},ova:{nome:`Ova Podre`,hp:170,speed:13,dps:10,scrap:20,r:26,desc:`Saco translúcido de ovos com olhos. Pinga. Choca quando morre e cospe pintinhos que fogem.`,hint:`Mate longe da entrada. Ou deixe a geladeira levar os pintinhos.`},larva:{nome:`Larva do Pintinho`,hp:18,speed:72,dps:8,scrap:3,r:10,desc:`Saiu da ova, já está com raiva. Tem dente antes de ter boca.`,hint:`Rápida, frágil. Qualquer coisa resolve.`},caranguejo:{nome:`Caranguejo Sindicado`,hp:110,speed:26,dps:22,scrap:15,r:22,desc:`Blindado perto de outro caranguejo e com cartaz de greve. Três olhos em hastes: um vigia, dois reclamam.`,hint:`Separe os dois. Isolado, perde a blindagem.`},bomba:{nome:`Peixe-Bomba`,hp:70,speed:30,dps:0,scrap:15,r:22,desc:`Um peixe com válvula de bujão no lombinho. Segura o espirro. Geme.`,hint:`Estoura na sua peça. Bujão na frente resolve, ou torrada de longe.`},gaivota:{nome:`Gaivota-Ladra`,hp:70,speed:38,dps:14,scrap:15,r:22,air:!0,desc:`Passa por cima da linha de frente com uma sacolinha plástica. Voa mal, por opção.`,hint:`Ventilador derruba. Holofote ofusca. Torradeira sozinha não pega.`},gaivota_r:{nome:`Gaivota-Rei`,hp:130,speed:30,dps:16,scrap:30,r:26,air:!0,desc:`Carrega uma engenhoca inteira. Já levou a geladeira de um vizinho. Vizinho junto.`,hint:`Abata antes que agarre a peça. Ventilador, holofote, bujão.`},tatu:{nome:`Tatu de Areia`,hp:120,speed:20,dps:20,scrap:18,r:22,desc:`Cava, some, reaparece duas colunas à frente. Coloca uma plaquinha onde afundou.`,hint:`Bujão no fundo do corredor. Holofote impede de cavar.`},lata:{nome:`Peixe-Lata`,hp:110,speed:20,dps:18,scrap:22,r:22,desc:`Escamas de lata, espelho no lugar da cara. Reflete a torrada na sua torradeira.`,hint:`Dano corpo a corpo, explosão, estilingue. Não insista no tiro.`},fantasma:{nome:`Peixe-Fantasma`,hp:55,speed:34,dps:12,scrap:25,r:20,desc:`Não tem nada ali. Tem sim. Rouba sucata do chão e foge pela direita. Olhos em X.`,hint:`Ataque revela. Holofote revela. Estilingue acerta no silêncio.`},polvo:{nome:`Polvo-Garrafa`,hp:140,speed:18,dps:20,scrap:25,r:24,desc:`Tem garrafas no corpo. Não destrói a peça: se pendura no braço dela e desliga. É sabotagem.`,hint:`Fica parado agarrado à peça. Mate rápido. Explosão não destrói garrafa, só barulho.`},agua:{nome:`Água-Viva-Fantasma`,hp:60,speed:24,dps:14,scrap:12,r:20,air:!0,desc:`Atravessa a primeira peça e vive no breu. Contra luz, evapora e deixa o formato dela no chão.`,hint:`SÓ luz ou explosão. O Holofote é a arma.`},mariposa:{nome:`Mariposa de Espelho`,hp:80,speed:34,dps:10,scrap:14,r:22,air:!0,desc:`Voa em direção ao farol, cega. As asas são dois pedaços de retrovisor.`,hint:`Na luz ela para e cozinha. Debaixo do holofote, morre de bobeira.`},sapo:{nome:`Sapo de Óleo`,hp:100,speed:24,dps:18,scrap:16,r:20,desc:`Pula duas colunas por vez. Pula em cima de fogo. Se morre no ar, cai no colo do próximo peixe.`,hint:`Não adianta corredor vazio na frente dele. Aranja precisa cobrir atrás.`},piranha:{nome:`Piranha-Coral`,hp:25,speed:60,dps:10,scrap:8,r:14,desc:`Nada em cardume. Sozinha é peixe. Com três, vira sindicato com dente.`,hint:`Em grupo fica forte. Área resolve. Bujão adora cardume.`},caranguejo_m:{nome:`Caranguejo-Mártir`,hp:120,speed:24,dps:20,scrap:18,r:22,desc:`Carrega a foto de outro caranguejo. Se morre perto de um amigo, o amigo fica furioso.`,hint:`Mate o mártir por último ou longe dos amigos. A fúria é real.`},baleia:{nome:`Baleia-Filhote`,hp:400,speed:12,dps:0,scrap:0,r:50,neutral:!0,desc:`Atravessa o mapa. Não machuca ninguém. Pisa nas suas peças e quebra. Não devia estar aqui.`,hint:`NÃO MATE. Use geladeira longe do caminho. Se ela morrer, o Zé fica uma onda calado.`},pescador:{nome:`O Pescador`,hp:60,speed:16,dps:0,scrap:0,r:24,human:!0,desc:`Um homem pela metade. Ainda fala. Ainda reconhece o barco. Não dá para matar o que já era gente.`,hint:`Rádio hipnotiza e redireciona. Cachorro late e confunde. Mata não dá.`},passageiro:{nome:`Passageiro do Trilho`,hp:90,speed:30,dps:18,scrap:16,r:22,desc:`Troca de trilho sem avisar muito. Carrega uma mala que não é dele.`,hint:`Escolha o corredor mais protegido e reze. Holofote prende no trilho.`}},enemyOrder:[`baiacu`,`enguia`,`ova`,`larva`,`caranguejo`,`bomba`,`gaivota`,`gaivota_r`,`tatu`,`lata`,`fantasma`,`polvo`,`agua`,`mariposa`,`sapo`,`piranha`,`caranguejo_m`,`baleia`,`pescador`,`passageiro`],bosses:{bento:{nome:`SEU BENTO, O COMEU-PESCADOR`,hp:2400,speed:11,dps:60,r:44,map:0,desc:`Era o Bento. O peixe comeu o Bento. O peixe usa as botas e o chapéu de pescador e diz que é o Bento.`,hint:`Fase 1 anda. Fase 2 sem chapéu, mais rápido. Fase 3 chama reforço e cospe sucata.`},faroleiro:{nome:`O FAROLEIRO`,hp:2200,speed:9,dps:45,r:40,map:1,desc:`O faroleiro ficou no posto. Há quanto tempo, ele não sabe. A luz agora sai do peito dele.`,hint:`Ele apaga tudo. Acenda holofotes antes do escuro e sobreviva ao breu.`},maquinista:{nome:`O MAQUINISTA`,hp:2600,speed:12,dps:55,r:46,map:2,desc:`Uma locomotiva com vontade própria, que usa um casaco de maquinista e apita. Ninguém vê o condutor.`,hint:`Ele telegrafa as passagens: saia do trilho antes do apito. Holofote mostra o trilho certo.`},peixe_mae:{nome:`A PEIXE-MÃE`,hp:3e3,speed:8,dps:40,r:52,map:3,desc:`Um baiacu grávido do tamanho de uma barraca. Tem medo de você. Tem mais medo de parir.`,hint:`Infla e reflete tiro. Espere murchar ou use fogo/explosão. Fura a barreira.`},gerente:{nome:`O GERENTE`,hp:3200,speed:10,dps:50,r:44,map:4,desc:`Um homem que virou boca de esteira. Sete fases, sete reuniões. Pede metas enquanto morde.`,hint:`As fases se atropelam. Um bujão e uma geladeira atrás de cada esteira.`},mare:{nome:`A MARÉ`,hp:1,speed:0,dps:0,r:0,map:5,unbeatable:!0,desc:`Não é bicho. É o mar com vontade. Não dá para matar: dá para amanhecer.`,hint:`Sobreviva 2 minutos. A maré sobe. O que quebrar, quebrou.`}},synergies:[{a:`radio`,b:`radio`,nome:`Rádio-Duet`,desc:`Dois rádios no mesmo corredor hipnotizam em área.`},{a:`ventilador`,b:`pneu`,nome:`Fogo Soprado`,desc:`O fogo do pneu é empurrado um corredor à frente.`},{a:`radio`,b:`ventilador`,nome:`Hipnose Forçada`,desc:`Empurrão em bicho hipnotizado dura o dobro.`},{a:`aspirador`,b:`bujao`,nome:`Sucção Explosiva`,desc:`O aspirador puxa pequenos para cima da bomba.`},{a:`torradeira`,b:`holofote`,nome:`Alcance Iluminado`,desc:`A torradeira atira nas 3 colunas acesas.`},{a:`estilingue`,b:`holofote`,nome:`Mira de Farol`,desc:`O estilingue acerta antes e não leva troco.`},{a:`boia`,b:`ima`,nome:`Coleta Automática`,desc:`A boia cospe mais rápido ao lado de um ímã.`},{a:`geladeira`,b:`geladeira_bomba`,nome:`Câmara Fria`,desc:`A bomba ganha vida extra e explode maior.`},{a:`batedeira`,b:`bujao`,nome:`Liquidificador Explosivo`,desc:`A batedeira arma o bujão girando.`},{a:`cachorro`,b:`radio`,nome:`Latido Hipnótico`,desc:`O cão redireciona o Pescador junto com o rádio.`}],treeBranches:[{id:`mare`,nome:`MARÉ`,desc:`Defesa. Sucata, peça e teimosia.`},{id:`costa`,nome:`COSTA`,desc:`O caminho. Atalhos e o que existe além.`},{id:`sobre`,nome:`SOBREVIVÊNCIA`,desc:`Você. Reboco, escudo e um pouco de sorte.`}],tree:[{id:`sucata_velha`,br:`mare`,nome:`Sucata Velha`,desc:`O Zé acha mais lixo antes da onda. +40 de sucata inicial.`,cost:25,max:3,per:{startScrap:40}},{id:`gambiarra`,br:`mare`,nome:`Gambiarra Fina`,desc:`Toda peça aguenta 8% mais porrada. Fita 8`,strip:`#4a5450`,accent:`#8aa8a0`,haze:`rgba(120,150,150,.16)`},estruturas:[[{id:`navio`,nome:`Navio-Mãe`,msg:`O NAVIO-MÃE ADERNOU. VIROU CEMITÉRIO.`},{id:`mastro`,nome:`Mastro do Norte`,msg:`O MASTRO DO NORTE CAIU.`}],[{id:`balsa`,nome:`Balsa da Dona Lú`,msg:`A BALSA DA DONA LÚ SE SOLTOU.`},{id:`guinda`,nome:`Guindaste`,msg:`O GUINDASTE AFUNDOU NO CONVÉS.`}],[{id:`boia`,nome:`Boia Grande`,msg:`A BOIA GRANDE AFUNDOU. IRONIA.`},{id:`caverna`,nome:`Caverna de Carcaça`,msg:`A CARCAÇA ABRIU.`}],[{id:`horta`,nome:`Horta do Zé`,msg:`A HORTA DO ZÉ FOI LEVADA.`},{id:`barraca`,nome:`Barraca do Pescador`,msg:`A BARRACA DO PESCADOR CAIU.`}],[{id:`trapiche`,nome:`Trapiche Velho`,msg:`O TRAPICHE VELHO AFUNDOU.`},{id:`cais`,nome:`Cais do Fundo`,msg:`O CAIS DO FUNDO DESABOU.`}],[{id:`margem`,nome:`Margem do Cemitério`,msg:`A MARGEM CEDEU. ELA JÁ ESTAVA CEDENDO DESDE 1998.`},{id:`farol_afundado`,nome:`Farol Afundado`,msg:`O FAROL AFUNDADO ACENDEU UMA VEZ. FOI NO FIM.`}]],pool:[`baiacu`,`enguia`,`polvo`,`agua`,`gaivota_r`,`piranha`,`fantasma`,`pescador`,`caranguejo_m`,`baleia`],extra:[`pescador`,`baleia`],boss:`mare`,intro:`Toda a sucata do mundo encalha aqui. Inclusive a que ainda se mexe.`,bossLine:`A MARÉ SUBIU. ELA NÃO VAI DESCER.`,bio:`O último mapa. Navios encalhados, a maré subindo e a resposta que ninguém queria. Não se defende uma vila: decide-se o que fazer com ela.`}],radio:[{map:0,wave:1,txt:`...posto de escuta da Barra Suja. Se alguém ouvir: a maré subiu três metros e não desceu.`},{map:0,wave:2,txt:`Dizem que é a fábrica. Não é a fábrica. A fábrica só emprestou a coragem.`},{map:0,wave:3,txt:`Zé da Barra Suja. Eu sei que você está aí. Ainda tem gente no farol.`},{map:1,wave:1,txt:`O faroleiro apagou a luz pra não ver o que subia. Depois esqueceu de acender.`},{map:1,wave:2,txt:`Meu nome? Faz tempo que ninguém pergunta. Pode me chamar de Voz.`},{map:1,wave:3,txt:`A mariposa não vem pela luz. Vem pelo calor de alguém que ainda está vivo.`},{map:2,wave:1,txt:`O trem não tem condutor. Ele tem um acordo com o trilho.`},{map:2,wave:2,txt:`Toquinho, se você estiver ouvindo: não desce na estação. Não desce.`},{map:2,wave:3,txt:`Eu estava no trem quando afundou. Eu conto isso do jeito que eu lembro, não do jeito que foi.`},{map:3,wave:1,txt:`Não defenda a feira por comida. Defenda por causa do cheiro de gente.`},{map:3,wave:2,txt:`O Pescador ainda fala o seu nome. Não mata o Pescador. Não foi ele que escolheu.`},{map:3,wave:3,txt:`A Peixe-Mãe é a única mãe aqui. Repare que ninguém estava protegendo os filhotes dela.`},{map:4,wave:1,txt:`A fábrica pagava por hora extra. O Gerente nunca mais foi embora, mesmo quando foi embora.`},{map:4,wave:2,txt:`Todos os canos que eles enterraram estão voltando. Devagar. Com juros.`},{map:4,wave:3,txt:`Se você chegou até aqui, você já sabe o que eu sou. Ainda finge que não.`},{map:5,wave:1,txt:`Dona Lú quer ir embora. Ela falou isso em voz alta um dia desses. Eu ouvi.`},{map:5,wave:2,txt:`As três coisas que você pode fazer daqui pra frente não têm nome bonito. Eu vou dizer os nomes.`},{map:5,wave:3,txt:`A podridão não é um monstro. É o mar reagindo. O sintoma é a gente.`}],zeFalas:[`Isso aí já foi tainha.`,`A torradeira era da minha sogra.`,`Esse tem olho demais.`,`O mar tá devolvendo o troco.`,`Se afundar o barco, eu nem ligo mais.`,`Dona Lú, entra pra dentro.`,`Cheiro de ovo. Não é ovo.`,`Eu vi um com dente no rabo.`,`O rádio só pega AM e lamento.`,`Esse aí veio com nota fiscal.`,`Não pisa no óleo. Esbarra, mas não pisa.`,`Já pesquei um desses. Ele pescou de volta.`,`Onze anos. Onze anos de diário.`,`Toquinho, sai daí, menino.`,`Eu ainda ligo. Não é pra você saber.`,`O Bento não era pra estar ali. Nem o peixe.`,`Se sobrar um, a gente come. Se sobrar dois, a gente negocia.`],zeRaro:`Meu irmão foi no barco. Ele não voltou. O peixe voltou com o boné dele. Eu não contei isso pra ninguém.`,luLines:[`A casa é minha, mas a vista é do mar. Quem quer ficar com uma vista dessa?`,`Eu quero ir embora, Zé. Não é coragem, é pé. Eu tenho perna e tenho idade.`,`Eu fico. Alguém tem que lavar a toalha do Toquinho.`,`Toda noite eu fecho a janela. Toda noite alguém bate do lado de fora.`,`Você já reparou que o rádio fala o seu nome antes de você pensar nele?`],toqLines:[`Eu vou ser pescador igual você, Zé!`,`Pega ele! Pega! Pega!`,`Dona Lú disse que eu tenho que dormir. Eu não tenho.`,`Eu vi o bicho com olho na barriga. Ele piscou pra mim.`,`Se eu jogar a lata longe, ele vai atrás?`,`Eu não tenho medo. Eu tenho um pouco, mas eu tenho mais de ser pescador.`],vozLines:[`Boa noite, costa podre. Você está ouvindo a Voz da Maré.`,`Não sou gravação. Gravação não erra o seu nome.`,`Eu era gente. Isso não é um pedido de desculpa, é informação.`,`O mar não odeia vocês. O mar só carrega. Carregar cansa.`,`Amanhã, às seis, a maré vira. Escolha antes.`],cartazes:{barra:[`NÃO É PEIXE. NÃO COMA.`,`PEIXE FRESCO??`,`O MAR NÃO DEVOLVE. O MAR COBRA.`,`FIADO SÓ PRA AMIGO`],farol:[`APAGUE A LUZ ANTES DE SAIR.`,`O FAROLEIRO ESTÁ NA TORRE (RISCADO)`,`NÃO ACENE PARA O MAR.`,`DIA 400 SEM CARTA`],estacao:[`NÃO CORRA NO TRILHO.`,`TREM DAS 3H: SEM CONFIRMAÇÃO`,`TOQUINHO, CASA.`,`SERVIÇO SUSPENSO DESDE 1998`],feira:[`PEIXE DO DIA. DIA INCERTO.`,`NÃO PERGUNTE DE ONDE VEIO`,`GELO NOVO SÓ NA TERÇA`,`3 POR 10. NÃO RECLAMA`],fabrica:[`META: 40 TONELADAS`,`SEGURANÇA PRIMEIRO (EXCETO HOJE)`,`NÃO RESPIRE NO SETOR 4.`,`O MAR É O DESTINO FINAL`],cemiterio:[`AQUI JAZ O QUE O MAR NÃO QUIS`,`DONA LÚ, 3º NAVIO`,`TOQUINHO: EU TE ENSINEI A AMARRAR`,`A MARÉ VAI VOLTAR. ELA SEMPRE VOLTA`]},endings:[{id:`farol`,titulo:`ACENDER O FAROL`,escolha:`Acender o farol e apontar a luz pro mar`,txt:`A vila acendeu o farol. Não como desculpa: como aviso. A luz entrou na água e o mar foi descendo, devagar, como quem se retira de uma conversa. Barra Suja não afundou. Ficou mais longe da costa. O peixe voltou a ter um olho só. Não todo peixe.`,ze:`A gente acendeu. Não consertou nada. Mas dá pra ver o horizonte, e isso já é uma diferença.`,lu:`Eu vou ficar na casa. Com a luz acesa, a vista até que presta.`,toq:`O farol tem uma manivela. Se eu girar sozinho, ele fica aceso a noite inteira?`,voz:`A Voz do Rádio não falou mais depois daquela noite.`},{id:`fechar`,titulo:`FECHAR A BAÍA`,escolha:`Fechar a baía com os navios e os escombros`,txt:`A vila fechou a baía com o que existia: barcaça, pneu, portão de galpão, duas geladeiras. Parou de chegar. Também parou de sair. Barra Suja virou uma tampa. O peixe dentro apodreceu. O que restou de gente aprendeu a viver de pé, no escuro, com a água no tornozelo.`,ze:`Fechou. Pronto. Não tem mar, não tem peixe, não tem problema. Só tem a gente, que é o problema.`,lu:`Tem uma toalha no varal que nunca mais secou. Umidade.`,toq:`Eu ainda escuto o peixe batendo do outro lado. Ele quer entrar. Ou quer que eu saia?`,voz:`A Voz do Rádio ficou do lado de fora. Repetia nomes. Nunca os mesmos.`},{id:`ouvir`,titulo:`RESPONDER AO RÁDIO`,escolha:`Responder a Voz do Rádio e aceitar o que ela é`,txt:`A vila respondeu ao rádio. A Voz agradeceu. O mar não ficou limpo: ficou quieto. A maré entrou sem quebrar nada, cobriu a rua, a casa, o barco, tudo, e ficou. Debaixo da água, a vila continua igual, e o peixe passa entre as portas sem comer o que não é peixe. Quem escuta o rádio de madrugada diz que a Voz agora lê uma lista de nomes. O primeiro é o irmão do Zé.`,ze:`Ela não mentiu. O mar só carregava. Agora ele tem com quem falar. É diferente.`,lu:`Eu fui embora. Não da vila. Da costa. Ainda abro a janela. A água tem a mesma cor de antes.`,toq:`A Voz disse meu nome certo. Do jeito que a minha mãe dizia. Eu não tenho medo.`,voz:`A Voz do Rádio não era o mar. Era uma mulher que o mar carregou e nunca devolveu. Ela só queria responder.`}],dailyMods:[{id:`sem_gelo`,nome:`SEM GELADEIRA`,desc:`Geladeira e Geladeira-Bomba fora de estoque hoje.`,ban:[`geladeira`,`geladeira_bomba`]},{id:`so_baiacu`,nome:`SÓ BAIACU`,desc:`Todas as criaturas são baiacu. Todos. Sem exceção.`,pool:[`baiacu`]},{id   <body>
    <div id="app">
      <div id="stage">
        <canvas id="cv" width="1280" height="846"></canvas>

        <!-- HUD leve em DOM: só o que muda muito (sucata fica no canvas) -->
        <div id="topbar" class="hidden">
          <button class="mini" data-act="pause" title="Pause (P)">II</button>
          <div id="trackName">—</div>
          <div class="spacer"></div>
          <div id="radioLamp" class="lamp" title="Rádio: clique pra sintonizar">AM</div>
          <button class="mini" data-act="toggleMute" title="Mudo (M)">♪</button>
        </div>

        <!-- Telas: título, saves, campanha, opções, pause, codex, árvore, fim -->
        <div id="screen" class="overlay hidden"></div>

        <!-- Banca do Zé entre ondas (aparece só quando o jogo pede) -->
        <div id="shop" class="overlay hidden"></div>

        <!-- Avisos rápidos (rádio, conquistas, história) -->
        <div id="toasts"></div>
        <div id="flash"></div>
      </div>
      <div id="rotate">Melhor deitado. Não é exigência, é sugestão.</div>
    </div>
