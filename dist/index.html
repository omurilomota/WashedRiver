n:`com Rádio: hipnotiza e empurra. Com Pneu em chamas: espalha o fogo.`},geladeira:{nome:`Geladeira`,cost:50,cd:10,hp:450,unlock:!0,desc:`Parede. Cheira mal, segura bem. Quando quebra, vira sucata.`,sin:`com Geladeira-Bomba: divide o estrago. Com Gelo: vira geleira.`},bujao:{nome:`Bujão P13`,cost:125,cd:15,hp:60,unlock:!0,desc:`Explode em 3x3 quando encostam. Pega voador, fantasma e quem se esconde.`,sin:`com Aspirador: puxa tudo pra cima dele. Com Batedeira: explode girando.`},holofote:{nome:`Holofote`,cost:110,cd:12,hp:90,unlock:!0,desc:`Acende três colunas: revela, derruba voador, impede escavação e amplia a torradeira.`,sin:`com Mariposa: ela fica boba na luz. Com Estilingue: mira melhor.`},ima:{nome:`Ímã de Geladeira`,cost:60,cd:9,hp:70,unlock:!0,desc:`Puxa sozinho a sucata do chão em volta. Não deixa nada pro fantasma.`,sin:`com Boia: a sucata chega sem clique. Preguiça é progresso.`},radio:{nome:`Rádio Velho`,cost:95,cd:11,hp:85,unlock:!0,desc:`Hipnotiza um bicho por 2s. O Seu Bento só riu. Combina com o ventilador.`,sin:`dois Rádios no corredor = hipnose em área (Rádio-Duet). Redireciona o Pescador.`},estilingue:{nome:`Estilingue`,cost:110,cd:7,hp:100,unlock:!1,air:!0,desc:`Atira lata, dano alto, recarga lenta. Silencioso: acerta fantasma, lata e voador sem levar troco.`,sin:`com Holofote: alcance maior. Com Espelho: risca o tiro.`},aspirador:{nome:`Aspirador Hidráulico`,cost:100,cd:9,hp:110,unlock:!1,desc:`Puxa bichos pequenos pra trás. Não empurra: atrai. É um aspirador com pernas.`,sin:`com Bujão: puxa pra cima da bomba. Com Batedeira: segura no liquidificador.`},batedeira:{nome:`Batedeira Velha`,cost:90,cd:7,hp:120,unlock:!1,desc:`Duas facas girando. Dano em área curta. Corpo a corpo: a lata não devolve faca.`,sin:`com Aspirador: junta e tritura. Com Bujão: pica e explode.`},espelho:{nome:`Espelho`,cost:80,cd:8,hp:100,unlock:!1,desc:`Devolve o que o Peixe-Lata mandou de volta. Ninguém sabe de onde veio.`,sin:`com Geladeira: reflexo duplo. Com Estilingue: o tiro passa limpo.`},pneu:{nome:`Pneu Queimado`,cost:70,cd:12,hp:200,unlock:!1,desc:`Barreira que pega fogo devagar. Barra pouco, queima muito. Fumaça atrapalha todo mundo.`,sin:`com Ventilador: fogo soprado pra frente. Chuva apaga por 6s.`},aranha:{nome:`Aranha-de-Encanamento`,cost:140,cd:14,hp:70,unlock:!1,desc:`Não fica numa coluna: atira em TODAS as colunas do corredor. Cara, frágil, pernuda.`,sin:`com Bujão: cobre os buracos. Com Holofote: acerta o que ninguém vê.`},geladeira_bomba:{nome:`Geladeira-Bomba`,cost:130,cd:16,hp:320,unlock:!1,desc:`É uma geladeira. Também é uma bomba. Quando quebra, divide o prejuízo.`,sin:`com Geladeira: segura mais. Com Pneu: fogo + estilhaço.`},cachorro:{nome:`Cachorro-de-Guarda`,cost:45,cd:8,hp:90,unlock:!1,desc:`É um balde com coleira. Late e empurra bicho pequeno. O Zé insiste que é cachorro.`,sin:`com Rádio: o latido redireciona o Pescador. Com qualquer coisa: constrange.`},coisa_ze:{nome:`Coisa do Zé`,cost:0,cd:0,hp:140,unlock:!1,special:!0,desc:`O Zé monta uma vez por partida. Ele escolhe. Você aceita. Ninguém sabe o que vem.`,sin:`com você: paciência.`},remover:{nome:`Pé de Cabra`,cost:0,cd:0,hp:0,unlock:!0,desc:`Arranca uma engenhoca. Devolve 25% em sucata. Não machuca ninguém, infelizmente.`,sin:`com o Zé: discussão.`}},shopBase:[`boia`,`torradeira`,`ventilador`,`geladeira`,`bujao`,`holofote`,`ima`,`radio`,`remover`],machOrder:[`boia`,`torradeira`,`lancador_lata`,`ventilador`,`geladeira`,`bujao`,`holofote`,`ima`,`radio`,`estilingue`,`aspirador`,`batedeira`,`espelho`,`pneu`,`aranha`,`geladeira_bomba`,`cachorro`,`coisa_ze`,`remover`],upgrades:{boia:[`rede dupla`,`hélice de lata`,`antena de cobre`],torradeira:[`fita isolante`,`torrada dupla`,`resistor de fogão`],lancador_lata:[`mola reforçada`,`cano duplo`,`lata incendiária`],ventilador:[`hélices duplas`,`motor de liquidificador`,`vento de furacão`],geladeira:[`ímã extra`,`porta reforçada`,`isopor por dentro`],bujao:[`fita e arame`,`registro aberto`,`bujão extra`],holofote:[`lâmpada nova`,`refletor de lata`,`fio direto no poste`],ima:[`ímã de geladeira`,`eletroímã de porta`,`bobina do transformador`],radio:[`antena de arame`,`alto-falante novo`,`fita do Zé`],estilingue:[`elástico de caminhão`,`munição de parafuso`,`forquilha de cano`],aspirador:[`saco novo`,`motor de oficina`,`segunda boca`],batedeira:[`facas de serra`,`motor trifásico`,`terceira faca`],espelho:[`moldura de janela`,`dois espelhos`,`espelho de farol`],pneu:[`mais borracha`,`gasolina velha`,`pilha de pneu`],aranha:[`cano mais longo`,`mais pernas`,`segunda aranha`],geladeira_bomba:[`fita vermelha`,`segundo pavio`,`duas geladeiras`],cachorro:[`segunda coleira`,`latinho novo`,`osso de borracha`],coisa_ze:[`mais coisa`,`mais Zé`,`não olha dentro`],remover:[`fita na empunhadura`,`cabo maior`,`nada. é um pé de cabra.`]},enemy:{baiacu:{nome:`Baiacu de Tampinha`,hp:90,speed:22,dps:25,scrap:10,r:22,desc:`Três olhos que piscam em ordem. Espinhos de tampinha de garrafa. Veio remando de barriga.`,hint:`Dano direto. Ele é o básico.`},enguia:{nome:`Enguia de Óleo`,hp:60,speed:52,dps:18,scrap:10,r:18,desc:`Escorregadia, mergulha, some. Deixa uma mancha preta em forma de má notícia.`,hint:`Torradeira não pega enquanto mergulha. Holofote acende e resolve.`},ova:{nome:`Ova Podre`,hp:170,speed:13,dps:10,scrap:20,r:26,desc:`Saco translúcido de ovos com olhos. Pinga. Choca quando morre e cospe pintinhos que fogem.`,hint:`Mate longe da entrada. Ou deixe a geladeira levar os pintinhos.`},larva:{nome:`Larva do Pintinho`,hp:18,speed:72,dps:8,scrap:3,r:10,desc:`Saiu da ova, já está com raiva. Tem dente antes de ter boca.`,hint:`Rápida, frágil. Qualquer coisa resolve.`},caranguejo:{nome:`Caranguejo Sindicado`,hp:110,speed:26,dps:22,scrap:15,r:22,desc:`Blindado perto de outro caranguejo e com cartaz de greve. Três olhos em hastes: um vigia, dois reclamam.`,hint:`Separe os dois. Isolado, perde a blindagem.`},bomba:{nome:`Peixe-Bomba`,hp:70,speed:30,dps:0,scrap:15,r:22,desc:`Um peixe com válvula de bujão no lombinho. Segura o espirro. Geme.`,hint:`Estoura na sua peça. Bujão na frente resolve, ou torrada de longe.`},gaivota:{nome:`Gaivota-Ladra`,hp:70,speed:38,dps:14,scrap:15,r:22,air:!0,desc:`Passa por cima da linha de frente com uma sacolinha plástica. Voa mal, por opção.`,hint:`Ventilador derruba. Holofote ofusca. Torradeira sozinha não pega.`},gaivota_r:{nome:`Gaivota-Rei`,hp:130,speed:30,dps:16,scrap:30,r:26,air:!0,desc:`Carrega uma engenhoca inteira. Já levou a geladeira de um vizinho. Vizinho junto.`,hint:`Abata antes que agarre a peça. Ventilador, holofote, bujão.`},tatu:{nome:`Tatu de Areia`,hp:120,speed:20,dps:20,scrap:18,r:22,desc:`Cava, some, reaparece duas colunas à frente. Coloca uma plaquinha onde afundou.`,hint:`Bujão no fundo do corredor. Holofote impede de cavar.`},lata:{nome:`Peixe-Lata`,hp:110,speed:20,dps:18,scrap:22,r:22,reflect:3,desc:`Escamas de lata, espelho no lugar da cara. Reflete a torrada na sua torradeira.`,hint:`Dano corpo a corpo, explosão ou estilingue. Três torradas devolvidas e a lata cansa: a quarta entra.`},fantasma:{nome:`Peixe-Fantasma`,hp:55,speed:34,dps:12,scrap:25,r:20,desc:`Não tem nada ali. Tem sim. Rouba sucata do chão e foge pela direita. Olhos em X.`,hint:`Ataque revela. Holofote revela. Estilingue acerta no silêncio.`},polvo:{nome:`Polvo-Garrafa`,hp:140,speed:18,dps:20,scrap:25,r:24,desc:`Tem garrafas no corpo. Não destrói a peça: se pendura no braço dela e desliga. É sabotagem.`,hint:`Fica parado agarrado à peça. Mate rápido. Explosão não destrói garrafa, só barulho.`},agua:{nome:`Água-Viva-Fantasma`,hp:60,speed:24,dps:14,scrap:12,r:20,air:!0,desc:`É intangível: o tiro não encosta e a peça não segura. Vive no breu; contra luz, evapora e deixa o formato no chão.`,hint:`SÓ luz ou explosão. Bala não pega. O Holofote é a arma.`},mariposa:{nome:`Mariposa de Espelho`,hp:80,speed:34,dps:10,scrap:14,r:22,air:!0,desc:`Voa em direção ao farol, cega. As asas são dois pedaços de retrovisor.`,hint:`Na luz ela para e cozinha. Debaixo do holofote, morre de bobeira.`},sapo:{nome:`Sapo de Óleo`,hp:100,speed:24,dps:18,scrap:16,r:20,desc:`Pula duas colunas por vez. Pula em cima de fogo. Se morre no ar, cai no colo do próximo peixe.`,hint:`Não adianta corredor vazio na frente dele. Aranja precisa cobrir atrás.`},piranha:{nome:`Piranha-Coral`,hp:25,speed:60,dps:10,scrap:8,r:14,desc:`Nada em cardume. Sozinha é peixe. Com três, vira sindicato com dente.`,hint:`Em grupo fica forte. Área resolve. Bujão adora cardume.`},caranguejo_m:{nome:`Caranguejo-Mártir`,hp:120,speed:24,dps:20,scrap:18,r:22,desc:`Carrega a foto de outro caranguejo. Se morre perto de um amigo, o amigo fica furioso.`,hint:`Mate o mártir por último ou longe dos amigos. A fúria é real.`},baleia:{nome:`Baleia-Filhote`,hp:400,speed:12,dps:0,scrap:0,r:50,desc:`Atravessa o mapa e só machuca quem ficar no caminho. Não devia estar aqui. Agora dá pra derrubar.`,hint:`É alvo: tiro, explosão e lâmina funcionam. Ventilador ainda espanta e ela volta pro mar; geladeira fora do caminho evita o esmagamento.`},pescador:{nome:`O Pescador`,hp:60,speed:16,dps:0,scrap:0,r:24,desc:`Um homem pela metade. Ainda fala. Agora dá pra matar — mas ele não quebra nada: se chegar na vila, cobra pedágio em sucata e volta pro mar.`,hint:`Rádio hipnotiza, redireciona e ainda rende sucata. Cachorro late e confunde. Sem resposta, ele cobra o pedágio.`},passageiro:{nome:`Passageiro do Trilho`,hp:90,speed:30,dps:18,scrap:16,r:22,desc:`Troca de trilho sem avisar muito. Carrega uma mala que não é dele.`,hint:`Escolha o corredor mais protegido e reze. Holofote prende no trilho.`}},enemyOrder:[`baiacu`,`enguia`,`ova`,`larva`,`caranguejo`,`bomba`,`gaivota`,`gaivota_r`,`tatu`,`lata`,`fantasma`,`polvo`,`agua`,`mariposa`,`sapo`,`piranha`,`caranguejo_m`,`baleia`,`pescador`,`passageiro`],bosses:{bento:{nome:`SEU BENTO, O COMEU-PESCADOR`,hp:2400,speed:11,dps:60,r:44,map:0,desc:`Era o Bento. O peixe comeu o Bento. O peixe usa as botas e o chapéu de pescador e diz que é o Bento.` .`},{a:`geladeira`,b:`geladeira_bomba`,nome:`Câmara Fria`,desc:`A bomba ganha vida extra e explode maior.`},{a:`batedeira`,b:`bujao`,nome:`Liquidificador Explosivo`,desc:`A batedeira arma o bujão girando.`},{a:`cachorro`,b:`radio`,nome:`Latido Hipnótico`,desc:`O cão redireciona o Pescador junto com o rádio.`}],treeBranches:[{id:`mare`,nome:`MARÉ`,desc:`Defesa. Sucata, peça e teimosia.`},{id:`costa`,nome:`COSTA`,desc:`O caminho. Atalhos e o que existe além.`},{id:`sobre`,nome:`SOBREVIVÊNCIA`,desc:`Você. Reboco, escudo e um pouco de sorte.`}],tree:[{id:`sucata_velha`,br:`mare`,nome:`Sucata Velha`,desc:`O Zé acha mais lixo antes da onda. +40 de sucata inicial.`,cost:25,max:3,per:{startScrap:40}},{id:`gambiarra`,br:`mare`,nome:`Gambiarra Fina`,desc:`Toda peça aguenta 8% mais porrada. Fita resolve.`,cost:60,max:3,per:{machineHp:.08}},{id:`banca`,br:`mare`,nome:`Banca do Zé`,desc:`Ele separa uma quarta oferta entre ondas. Não necessariamente boa.`,cost:140,max:1,per:{extraOffer:!0}},{id:`pilha`,br:`mare`,nome:`Pilha de Boia`,desc:`Começa cada partida com uma boia já no píer. Ela cata, você clica.`,cost:120,max:1,per:{startBoias:1}},{id:`oficina`,br:`mare`,nome:`Oficina de Fundo`,desc:`Desbloqueia Estilingue e Batedeira. O Zé já pegou fogo nessa oficina.`,cost:90,max:1,unlock:`estilingue`},{id:`arame`,br:`mare`,nome:`Arame Reforçado`,desc:`Desbloqueia Espelho e Pneu Queimado. Não é à prova de nada.`,cost:130,max:1,unlock:`espelho`},{id:`atalho_2`,br:`costa`,nome:`Atalho do Farol`,desc:`Libera o Farol do Fim no mapa. O Zé conhece o caminho, jura.`,cost:80,max:1},{id:`atalho_3`,br:`costa`,nome:`Trilho de Volta`,desc:`Libera a Estação Afogada. Barato. Suspeito.`,cost:140,max:1},{id:`historias`,br:`costa`,nome:`Caderno de Histórias`,desc:`Grava mensagens de rádio no bestiário e +1 estrela em mapas antigos.`,cost:110,max:1,per:{metaBonus:10}},{id:`batedor`,br:`costa`,nome:`Batedor de Costa`,desc:`+20% de sucata velha em toda partida. Você passa mais tempo fora.`,cost:160,max:2, ncalhados, a maré subindo e a resposta que ninguém queria. Não se defende uma vila: decide-se o que fazer com ela.`}],radio:[{map:0,wave:1,txt:`...posto de escuta da Barra Suja. Se alguém ouvir: a maré subiu três metros e não desceu.`},{map:0,wave:2,txt:`Dizem que é a fábrica. Não é a fábrica. A fábrica só emprestou a coragem.`},{map:0,wave:3,txt:`Zé da Barra Suja. Eu sei que você está aí. Ainda tem gente no farol.`},{map:1,wave:1,txt:`O faroleiro apagou a luz pra não ver o que subia. Depois esqueceu de acender.`},{map:1,wave:2,txt:`Meu nome? Faz tempo que ninguém pergunta. Pode me chamar de Voz.`},{map:1,wave:3,txt:`A mariposa não vem pela luz. Vem pelo calor de alguém que ainda está vivo.`},{map:2,wave:1,txt:`O trem não tem condutor. Ele tem um acordo com o trilho.`},{map:2,wave:2,txt:`Toquinho, se você estiver ouvindo: não desce na estação. Não desce.`},{map:2,wave:3,txt:`Eu estava no trem quando afundou. Eu conto isso do jeito que eu lembro, não do jeito que foi.`},{map:3,wave:1,txt:`Não defenda a feira por comida. Defenda por causa do cheiro de gente.`},{map:3,wave:2,txt:`O Pescador ainda fala o seu nome. Não mata o Pescador. Não foi ele que escolheu.`},{map:3,wave:3,txt:`A Peixe-Mãe é a única mãe aqui. Repare que ninguém estava protegendo os filhotes dela.`},{map:4,wave:1,txt:`A fábrica pagava por hora extra. O Gerente nunca mais foi embora, mesmo quando foi embora.`},{map:4,wave:2,txt:`Todos os canos que eles enterraram estão voltando. Devagar. Com juros.`},{map:4,wave:3,txt:`Se você chegou até aqui, você já sabe o que eu sou. Ainda finge que não.`},{map:5,wave:1,txt:`Dona Lú quer ir embora. Ela falou isso em voz alta um dia desses. Eu ouvi.`},{map:5,wave:2,txt:`As três coisas que você pode fazer daqui pra frente não têm nome bonito. Eu vou dizer os nomes.`},{map:5,wave:3,txt:`A podridão não é um monstro. É o mar reagindo. O sintoma é a gente.`}],zeFalas:[`Isso aí já foi tainha.`,`A torradeira era da minha sogra.`,`Esse tem olho demais.`,`O mar tá devolvendo  problema.`,lu:`Tem uma toalha no varal que nunca mais secou. Umidade.`,toq:`Ainda escuto o peixe batendo do outro lado. Quer entrar. Ou quer que eu saia. Um dos dois.`,voz:`A Voz ficou do lado de fora, lendo nome. Nenhum era meu.`},{id:`ouvir`,titulo:`RESPONDER AO RÁDIO`,escolha:`Responder a Voz do Rádio e aceitar o que ela é`,txt:`A vila respondeu ao rádio. A Voz agradeceu e desligou. O mar não ficou limpo: ficou quieto, que é o melhor que ele faz. A maré entrou, cobriu a rua, a casa e o barco, e parou aí, como visita mal-educada. O peixe passa entre as portas e não come nada: não é educação, é falta de interesse. Quem escuta de madrugada diz que a Voz agora lê uma lista de mercado. O primeiro item é café.`,ze:`Ela não mentiu. O mar só carregava. Agora tem com quem conversar. Sina de quem não tem mais o que fazer.`,lu:`Eu fui embora. Da costa, não da vila. Abro a janela do mesmo jeito. A água continua com a mesma cor, o que me irrita.`,toq:`A Voz disse meu nome certo, do jeito que minha mãe dizia quando eu tava encrencado.`,voz:`A Voz não era o mar. Era gente que o mar carregou e não devolveu. Ela só queria terminar a conversa.`}],dailyMods:[{id:`sem_gelo`,nome:`SEM GELADEIRA`,desc:`Geladeira e Geladeira-Bomba fora de estoque hoje.`,ban:[`geladeira`,`geladeira_bomba`]},{id:`so_baiacu`,nome:`SÓ BAIACU`,desc:`Todas as criaturas são baiacu. Todos. Sem exceção.`,pool:[`baiacu`]},{id:`sucata_inf`,nome:`SUCATA DEMAIS`,desc:`Começa com 999 de sucata e recursos dobrados.`,scrap:999,res:2},{id:`turbo`,nome:`TUDO RÁPIDO`,desc:`Criaturas 30% mais rápidas. A paciência também.`,speed:1.3},{id:`vidro`,nome:`PEÇAS DE VIDRO`,desc:`Máquinas com metade da vida. Não balance o gancho.`,machHp:.5},{id:`maré`,nome:`MARÉ CHEIA`,desc:`Recurso dobra. Bicho também tem o dobro de vida.`,res:2,enemyHp:1.5},{id:`chefes`,nome:`CHEFE ANTES DA HORA`,desc:`A onda 2 vem com o chefe do mapa. Boa sorte.`,bossEarly:!0},{id:`escuridao`,nome:`NOITE PERMANENTE`,desc:`O mapa fica no escuro. Holofote e es   <body>
    <div id="app">
      <div id="stage">
        <canvas id="cv" width="1280" height="846"></canvas>

        <!-- HUD leve em DOM: só o que muda muito (sucata fica no canvas) -->
        <div id="topbar" class="hidden">
          <button class="mini" data-act="pause" title="Pause (P)">II</button>
          <div id="trackName">—</div>
          <div class="spacer"></div>
          <div id="radioLamp" class="lamp" title="Rádio: clique pra sintonizar">AM</div>
          <button class="mini" data-act="toggleMute" title="Mudo (M)">♪</button>
        </div>

        <!-- Telas: título, saves, campanha, opções, pause, codex, árvore, fim -->
        <div id="screen" class="overlay hidden"></div>

        <!-- Banca do Zé entre ondas (aparece só quando o jogo pede) -->
        <div id="shop" class="overlay hidden"></div>

        <!-- Avisos rápidos (rádio, conquistas, história) -->
        <div id="toasts"></div>
        <div id="flash"></div>
      </div>
      <div id="rotate">Melhor deitado. Não é exigência, é sugestão.</div>
    </div>

  </body>
