    ctx.fillStyle='#0e1618';ctx.beginPath();ctx.arc(0,-82,10*(1-p*.4),Math.PI,0);ctx.fill();
    ctx.fillStyle='#3a3a2a';ctx.fillRect(-30,-4,60,4);
    ctx.fillStyle='#0e0e0c';ctx.beginPath();ctx.arc(30+((t*14)%40),-8,8,0,7);ctx.fill();
    if(t>1.2){ctx.fillStyle='#e8d9a8';ctx.font='9px monospace';ctx.fillText('A LUZ ENTROU NO MAR.',-52,-100);}
    if(t>3){ctx.fillStyle='#c8d8c0';ctx.font='9px monospace';ctx.fillText('O POSTO FICOU VAZIO. O CHAPÉU TAMBÉM.',-80,-86);}
    ctx.fillStyle=`rgba(255,245,190,${.4*(1-p)})`;ctx.fillRect(-90,-140,180,150);
  }else if(B==='maquinista'){ // descarrilha, apita, as rodas continuam
    ctx.save();ctx.rotate(clamp(t*.5,0,.4));ctx.fillStyle='#3a2a22';ctx.fillRect(-50,-40,90,34);
    ctx.fillStyle='#1a1412';ctx.beginPath();ctx.moveTo(40,-40);ctx.lineTo(60,-60);ctx.lineTo(60,-40);ctx.fill();ctx.restore();
    for(const s of[-1,1]){const cx=s*(30+t*80);ctx.strokeStyle='#6a5a40';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,-10,13,0,7);ctx.stroke();}
    ctx.fillStyle='rgba(200,200,190,.35)';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(-40+i*24,-52-Math.sin(t*3+i)*14,10+i*2,0,7);ctx.fill();}
    ctx.fillStyle='#e8d9a8';ctx.font='9px monospace';ctx.fillText('O APITO CONTINUA.',-40,-100);
    ctx.fillStyle='#8a7a5a';ctx.fillRect(-8,-70,16,8);ctx.fillStyle='#e8d070';ctx.fillRect(12,-64,10,4);
    if(t>3)ctx.fillText('NINGUÉM VIU O CONDUTOR.',-52,-86);
  }else if(B==='peixe_mae'){ // explode em 50 peixes: a maternidade
    if(t<1.4){const s=1+t*.4;ctx.save();ctx.scale(s,s);ctx.fillStyle='#9bb04a';ctx.beginPath();ctx.arc(0,-54,48,0,7);ctx.fill();
      ctx.fillStyle='#d8d890';ctx.beginPath();ctx.ellipse(-4,-38,30,18,0,0,7);ctx.fill();ctx.restore();
      ctx.fillStyle='#fff';ctx.font='bold 13px Impact,sans-serif';ctx.fillText('PREPARA...',-38,-110);
    }else{
      for(let i=0;i<50;i++){const a=i*2.39,sp=(t-1.4)*(60+i*3),fx=Math.cos(a)*sp,fy=Math.sin(a)*sp*.55-((t-1.4)*(t-1.4))*25;
        const fxp=fx-((t-1.4)*60);
        ctx.fillStyle=i%3?'#9bb04a':'#c8843a';ctx.beginPath();ctx.ellipse(fxp,fy-24,5,3,0,0,7);ctx.fill();
        ctx.fillStyle='#222';ctx.beginPath();ctx.arc(fxp-2,fy-25,1,0,7);ctx.fill();}
      ctx.fillStyle='#e8d9a8';ctx.font='9px monospace';ctx.fillText('50 FILHOTES. TODOS COM FOME.',-64,-96);
      if(t>4)ctx.fillText('VOCÊ VIU DE ONDE VINHAM, AGORA.',-64,-82);
    }
  }else if(B==='gerente'){ // a esteira cospe papelada e ele reclama
    ctx.fillStyle='#2a2a2e';ctx.fillRect(-30,-40,60,36);ctx.fillStyle='#0e0e10';ctx.fillRect(-18,-30,36,10);
    for(let i=0;i<12;i++){const px=(i%4)*16-24-Math.sin(t*6+i)*4,py=-20+((t*70+i*11)%60);
      ctx.fillStyle='#e8e0d0';ctx.fillRect(px,py,12,8);ctx.fillStyle='#9a9a90';ctx.fillRect(px,py+2,9,1);}
    ctx.fillStyle='#e8d9a8';ctx.font='9px monospace';ctx.fillText('FORA DO HORÁRIO.',-36,-76);
    if(t>2.4)ctx.fillText('O CRACHÁ VIROU PEIXE.',-36,-62);
    if(t>4.4){ctx.fillStyle='#c8a060';rr(-20,-58,40,22,2);ctx.fill();ctx.fillStyle='#3a2a1a';ctx.font='7px monospace';ctx.fillText('META',-10,-45);}
  }else{ // A MARÉ: não morre, amanhece
    const dawn=clamp(p*1.6,0,1);
    ctx.fillStyle=`rgba(255,180,110,${dawn*.35})`;ctx.fillRect(FIELD_R-100,0,W-FIELD_R+100,H);
    ctx.fillStyle='#e8d9a8';ctx.font='bold 12px monospace';ctx.fillText('AMANHECEU.',-40,-80);
    if(t>2)ctx.fillStyle='#f0e4bd',ctx.fillText('O MAR NÃO FOI EMBORA.',-56,-62);
    if(t>4)ctx.fillStyle='#c8d8c0',ctx.fillText('ELE SÓ PAROU DE GRITAR.',-56,-46);
    ctx.fillStyle='rgba(220,240,230,.3)';for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(rnd(-60,60),rnd(-100,-10),rnd(2,5),0,7);ctx.fill();}
  }
  ctx.restore();ctx.globalAlpha=1;
}

/* ===== ui.js ===== */
/* =====================================================================
   ui.js — telas, menus, HUD, codex, árvore, loja e epílogo.
   DOM para texto; canvas para HUD. Tudo acionado por data-act.
   ===================================================================== */
const UI=(function(){
  const $=id=>document.getElementById(id);
  const scr=$('screen'),shopEl=$('shop'),top=$('topbar');
  let lastToast=0;

  // ---------- utilidades ----------
  function stars(n){return '<span class="stars">'+'★'.repeat(n)+'☆'.repeat(3-n)+'</span>';}
  function openScreens(){scr.classList.remove('hidden');}
  function hide(){scr.classList.add('hidden');shopEl.classList.add('hidden');}
  function setScreen(html){scr.innerHTML='<div class="scr"><div class="scr-inner">'+html+'</div></div>';openScreens();}
  function btn(label,act,arg,cls){return '<button class="btn '+(cls||'')+'" data-act="'+act+'"'+(arg!==undefined?' data-arg="'+arg+'"':'')+'>'+label+'</button>';}
  function tag(t,cls){return '<span class="tag '+(cls||'')+'">'+t+'</span>';}
  function meta(){return SaveDB.slot.oldScrap||0;}
  const toast=(kind,text)=>{
    const box=$('toasts');if(!box)return;
    const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=text;box.appendChild(d);
    while(box.children.length>4)box.removeChild(box.firstChild);
    setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity='0';setTimeout(()=>d.remove(),420);},kind==='ach'?6000:5200);
  };
  function achCount(){return Object.keys(SaveDB.slot.ach||{}).length;}
  function mapUnlocked(i){return i<=SaveDB.slot.campaign;}

  // ---------- TÍTULO ----------
  function title(){
    const s=SaveDB.slot;
    const slotHTML=[0,1,2].map(i=>{const sl=SaveDB.slotInfo(i);
      return '<div class="slot '+(i===SaveDB.slotIndex?'on':'')+'" data-act="slot" data-arg="'+i+'" tabindex="0">'+
        '<b>'+sl.name+'</b><small>'+(sl.oldScrap||0)+' sucata velha · '+Object.keys(sl.ach||{}).length+' selos</small>'+
        '<small>Mapa '+(sl.campaign+1)+'/6'+(sl.lastPlayed?' · jogado':' · novo')+'</small></div>';}).join('');
    setScreen(
      '<div class="logo">MARÉ<br><em>PODRE</em></div>'+
      '<div class="logo-sub">A COSTA NÃO PERDOA · CAPÍTULO FINAL</div>'+
      '<div class="slotbar">'+slotHTML+'</div>'+
      '<div class="menu">'+
        (s.campaign>0||s.lastPlayed? btn('CONTINUAR CAMPANHA','continue','','primary') : btn('COMEÇAR A CAMPANHA','maps','','primary'))+
        btn('MAPAS','maps')+
      '</div>'+
      '<div class="menu">'+
        btn('NOITE INFINITA','endlessmenu','','small')+
        btn('MODO CHEFE','bossmenu','','small')+
        btn('DESAFIO DO DIA','dailymenu','','small')+
        btn('SANDBOX','sandbox','','small')+
      '</div>'+
      '<div class="menu">'+
        btn('BESTIÁRIO','codex','','tiny')+btn('ÁRVORE','tree','','tiny')+btn('OPÇÕES','options','','tiny')+
        btn('SLOTS','slots','','tiny')+btn('COMO JOGAR','help','','tiny')+
      '</div>'+
      '<div class="bottomline">Sucata velha: <b class="gold">'+meta()+'</b> · selos: '+achCount()+'/10 · mapa liberado: '+Math.min(6,s.campaign+1)+'/6<br>'+
      'A música, os bichos e a vila são sintetizados na hora. Clique uma vez pra liberar o som.</div>'
    );
    top.classList.add('hidden');
  }

  // ---------- SLOTS ----------
  function slots(){
    const cards=[0,1,2].map(i=>{const s=SaveDB.slotInfo(i);
      return '<div class="slot '+(i===SaveDB.slotIndex?'current':'')+'">'+
        '<h3>'+s.name+'</h3>'+
        '<div class="kv">sucata velha: <b>'+s.oldScrap+'</b><br>campanha: <b>'+Math.min(6,s.campaign+1)+'/6</b><br>partidas: <b>'+(s.runs||0)+'</b> · selos: <b>'+Object.keys(s.ach||{}).length+'/10</b><br>'+
        'último jogo: '+(s.lastPlayed?new Date(s.lastPlayed).toLocaleDateString('pt-BR'):'nunca')+'</div>'+
        '<div class="row" style="justify-content:flex-start">'+btn('USAR','slot',i,'small')+
        '<button class="btn dark" data-act="newslot" data-arg="'+i+'">APAGAR</button></div></div>';}).join('');
    setScreen('<h2 style="font-family:Impact;font-weight:400;color:var(--bone);font-size:30px;margin:0">SLOTS</h2>'+
      '<p class="muted">Cada slot tem sua própria árvore, campanha e bestiário. A sucata velha não viaja.</p>'+
      '<div class="slots">'+cards+'</div>'+
      '<div class="space"></div>'+btn('VOLTAR','title','','small'));
  }

  // ---------- MAPAS ----------
  function mapArt(m){const p=m.pal;return 'background:linear-gradient(180deg,'+p.sky1+' 0%,'+p.sky2+' 55%,'+p.water+' 56%,'+p.water+' 100%)';}
  function maps(){
    const cards=MAPS.map((m,i)=>{
      const unl=mapUnlocked(i);const st=SaveDB.slot.stars[i]||0;
      return '<div class="mapcard '+(unl?'':'locked')+'" data-act="'+(unl?'map':'nada')+'" data-arg="'+i+'">'+
        '<div class="art" style="'+mapArt(m)+'"><div class="no">'+(i+1)+'</div>'+(unl?'<div class="stars">'+stars(st)+'</div>':'<div class="stars" style="color:#777">TRANCADO</div>')+'</div>'+
        '<h3>'+m.nome+'</h3><p>'+m.sub+'</p>'+
        '<div class="tags">'+tag(m.weather.toUpperCase())+tag(m.resShort,'hot')+tag(m.boss==='mare'?'FINAL':'CHEFE')+'</div>'+
        '<p style="margin-top:6px;color:#8d907c">'+m.bio+'</p></div>';}).join('');
    setScreen('<h2 style="font-family:Impact;font-weight:400;color:var(--bone);font-size:30px;margin:0">A COSTA</h2>'+
      '<p class="muted">Três ondas e um chefe por mapa. Terminar um mapa abre o próximo. Você pode voltar e melhorar a nota.</p>'+
      '<div class="mapgrid">'+cards+'</div>'+
      '<div class="space"></div>'+btn('VOLTAR','title','','small'));
  }

  // ---------- MODOS ----------
  function endlessMenu(){
    const map=clamp(SaveDB.slot.campaign,0,5);
    setScreen('<h2 style="font-family:Impact;font-weight:400;font-size:32px;color:var(--bone)">NOITE INFINITA</h2>'+
      '<p class="muted">Sem chefe marcado, sem amanhã. A cada três ondas vem um Seu Bento de encomenda. Melhor marca: '+JSON.stringify(SaveDB.slot.endlessBest)+'.</p>'+
      '<div class="mapgrid" style="grid-template-columns:repeat(3,1fr)">'+
      [['DEVAGAR','costa calma, maré mansa',0],['COMO SEMPRE','do jeito que o mar gosta',1],['SEM DÓ','eles comeram o almoço',2]].map(d=>
        '<div class="mapcard" data-act="endless" data-arg="'+d[2]+'"><div class="art" style="background:linear-gradient(180deg,#1a2a2e,#0a1418)"><div class="no">∞</div></div>'+
        '<h3>'+d[0]+'</h3><p>'+d[1]+'</p><div class="tags">'+tag('MAPA: '+MAPS[map].nome)+'</div></div>').join('')+
      '</div><div class="space"></div>'+btn('VOLTAR','title','','small'));
  }
  function bossMenu(){
    const cards=MAPS.map((m,i)=>{const b=BOSSES[m.boss];const unl=mapUnlocked(i);const best=SaveDB.slot.bossBest[i];
      return '<div class="mapcard '+(unl?'':'locked')+'" data-act="'+(unl?'boss':'nada')+'" data-arg="'+i+'">'+
        '<div class="art" style="'+mapArt(m)+'"><div class="no">'+(i+1)+'</div></div>'+
        '<h3>'+b.nome+'</h3><p>'+b.desc+'</p><div class="tags">'+tag('FASES: '+(m.boss==='mare'?'SOBREVIVER':m.boss==='gerente'?'7':'3'))+'</div>'+
        (best?'<p class="gold">melhor: '+Math.round(best)+'s</p>':'')+'</div>';}).join('');
    setScreen('<h2 style="font-family:Impact;font-weight:400;font-size:32px;color:var(--bone)">MODO CHEFE</h2>'+
      '<p class="muted">Sem onda de aquecimento. Você entra com 200 de sucata e a vila inteira de pé. É treino. Sua vila quebra de verdade.</p>'+
      '<div class="mapgrid">'+cards+'</div><div class="space"></div>'+btn('VOLTAR','title','','small'));
  }
  function dailyPreview(){
    const seed=hashStr(dayKey()+(SaveDB.slotIndex+1)),rng=mulberry(seed);
    const mods=shuffle(DAILY_MODS.slice()).filter(()=>rng()<.4).slice(0,2);
    const mapIndex=Math.floor(rng()*Math.min(6,SaveDB.slot.campaign+1));
    return{mods:mods.length?mods:[DAILY_MODS[0]],map:mapIndex};
  }
  function dailyMenu(){
    const d=dailyPreview(),done=SaveDB.slot.daily&&SaveDB.slot.daily.date===dayKey();
    setScreen('<h2 style="font-family:Impact;font-weight:400;font-size:32px;color:var(--bone)">DESAFIO DO DIA</h2>'+
      '<p class="muted">Data do sistema: '+dayKey()+' · mapa: '+MAPS[d.map].nome+'</p>'+
      '<div class="grid2">'+d.mods.map(m=>'<div class="offer"><div class="kind">MODIFICADOR</div><h4>'+m.nome+'</h4><p>'+m.desc+'</p></div>').join('')+'</div>'+
      '<p class="muted" style="margin-top:10px">Recorde de hoje: <b class="gold">'+(done?SaveDB.slot.daily.score:0)+'</b> ondas aguentadas.</p>'+
      '<div class="row">'+btn('JOGAR O DIA','daily','','primary')+btn('VOLTAR','title','','small')+'</div>');
  }

  // ---------- PAUSA ----------
  function pause(){
    setScreen('<h2 style="font-family:Impact;font-weight:400;font-size:34px;color:var(--bone)">PAUSA</h2>'+
      '<p class="muted">'+G.map.nome+' · '+String(G.map.resShort)+' · onda '+(G.survived+1)+' · '+Math.round(G.t)+'s<br>'+
      'peças: '+G.machines.length+' · bichos mortos: '+G.kills+' · sucata: '+G.scrap+'</p>'+
      '<div class="menu">'+btn('RETOMAR','resume','','primary')+btn('OPÇÕES','options','')+btn('BESTIÁRIO','codex','')+
      btn('REINICIAR','retry','','danger')+btn('SALVAR','save','','small')+btn('SAIR PRO TÍTULO','title','','small')+'</div>'+
      '<div class="bottomline">Salva automaticamente a cada onda e ao sair. P pausa, M silencia, 1–9 escolhe peça.<br>Legenda: 🟩 estrutura de pé · 🟥 destruída · ícones da vila = vidas.</div>');
  }

  // ---------- OPÇÕES ----------
  function options(){
    const o=SaveDB.options;
    setScreen('<h2 style="font-family:Impact;font-weight:400;font-size:32px;color:var(--bone)">OPÇÕES</h2>'+
      '<div class="opts">'+
      slider('master','VOLUME GERAL',o.master)+slider('music','MÚSICA',o.music)+slider('sfx','EFEITOS',o.sfx)+
      '<div class="opt"><label>TREMER A TELA<span class="sub">Desligue se passar mal. É sério.</span></label>'+
        '<select data-act="opt" data-arg="shake">'+(o.shake?'<option value="1" selected>LIGADO</option><option value="0">DESLIGADO</option>':'<option value="1">LIGADO</option><option value="0" selected>DESLIGADO</option>')+'</select></div>'+
      '<div class="opt"><label>MODO DALTONISMO<span class="sub">Troca cores de estado e reforça bordas.</span></label>'+
        '<select data-act="opt" data-arg="cb">'+(o.cb?'<option value="1" selected>LIGADO</option><option value="0">DESLIGADO</option>':'<option value="1">LIGADO</option><option value="0" selected>DESLIGADO</option>')+'</select></div>'+
      '<div class="opt"><label>TAMANHO DA LETRA<span class="sub">Interface acima do canvas.</span></label>'+
        '<select data-act="opt" data-arg="font">'+[.9,1,1.15,1.3].map(v=>'<option value="'+v+'" '+(o.font===v?'selected':'')+'>'+Math.round(v*100)+'%</option>').join('')+'</select></div>'+
      '<div class="opt"><label>SOM<span class="sub">Também no M durante o jogo.</span></label>'+
        '<select data-act="muteopt">'+(Snd.muted?'<option value="0">LIGADO</option><option value="1" selected>MUDO</option>':'<option value="0" selected>LIGADO</option><option value="1">MUDO</option>')+'</select></div>'+
      '</div>'+
      '<div class="row" style="margin-top:14px">'+btn('VOLTAR','back','','small')+btn('SALVAR TUDO','save','','small')+'</div>'+
      '<p class="muted" style="margin-top:12px">Toda escolha do Zé pausa o jogo: não existe evento com tempo obrigatório.</p>');
  }
  function slider(id,label,v){
    return '<div class="opt"><label>'+label+'<span class="sub">'+Math.round(v*100)+'%</span></label>'+
      '<input type="range" min="0" max="1" step="0.05" value="'+v+'" data-act="vol" data-arg="'+id+'"></div>';
  }

  // ---------- CODEX ----------
  let codexTab='bestiary';
  function codex(tab){
    if(tab)codexTab=tab;
    const s=SaveDB.slot;
    const seenB=Object.keys(s.seenB||{}).length,seenM=Object.keys(s.seenM||{}).length;
    const tabs=['bestiary','machines','radio','ach'];
    let body='';
    if(codexTab==='bestiary'){
      body='<div class="codexGrid">'+ENEMY_ORDER.map(id=>{
        const e=ENEMY[id],seen=!!s.seenB[id]||seenB>0&&false;
        return '<div class="beast '+(seen?'seen':'locked')+'"><h4>'+(seen?e.nome:'???')+'</h4>'+
          '<p>'+(seen?e.desc:'Você ainda não viu esse. Ou viu e não voltou pra contar.')+'</p>'+
          '<div class="kill">'+(seen?'COMO RESOLVER: '+e.hint:'DICA: sobreviva.')+'</div></div>';}).join('')+
        Object.entries(BOSSES).map(([id,b])=>'<div class="beast '+(s.seenB[id]?'seen':'locked')+'"><h4>'+(s.seenB[id]?b.nome:'???')+'</h4>'+
          '<p>'+(s.seenB[id]?b.desc:'Chefe não catalogado.')+'</p><div class="kill">'+(s.seenB[id]?b.hint:'')+'</div></div>').join('')+'</div>'+
        '<p class="muted" style="margin-top:8px">'+seenB+'/'+ENEMY_ORDER.length+' criaturas catalogadas. O que não viu continua borrado.</p>';
    }else if(codexTab==='machines'){
      body='<div class="codexGrid">'+MACH_ORDER.map(id=>{const m=MACH[id],seen=!!s.seenM[id];
        return '<div class="beast '+(seen?'seen':'locked')+'"><h4>'+(seen?m.nome:'???')+'</h4><p>'+(seen?m.desc:'Ainda não construiu.')+'</p>'+
          '<div class="kill">'+(seen?'SINERGIA: '+m.sin:'')+'</div></div>';}).join('')+'</div>'+
        '<p class="muted" style="margin-top:8px">'+seenM+'/'+MACH_ORDER.length+' engenhocas na galeria.</p>';
    }else if(codexTab==='radio'){
      const unlocked=!!s.tree['historias']||true;
      body='<div class="scroll"><div class="panel">'+
        RADIO.map(r=>'<p style="margin-bottom:7px">'+(r.map<=s.campaign||unlocked?'<span class="acid">['+MAPS[r.map].nome+']</span> '+r.txt:'<span class="muted">[frequência morta]</span>')+'</p>').join('')+
        '</div></div><p class="muted">A Voz do Rádio fala em todas as frequências. Nenhuma é oficial.</p>';
    }else{
     body='<div class="codexGrid">'+ACHIEVEMENTS.map(a=>{const got=!!s.ach[a.id];
        return '<div class="beast '+(got?'seen':'locked')+'"><h4>'+(got?a.nome:'SELO OCULTO')+'</h4><p>'+(got?a.desc:'O Zé sabe. Não fala.')+'</p></div>';}).join('')+'</div>'+
        '<p class="muted">Conquistas não dão vantagem. Dão assunto.</p>';
    }
    setScreen('<h2 style="font-family:Impact;font-weight:400;font-size:30px;color:var(--bone)">CADERNO DO ZÉ</h2>'+
      '<div class="tabs">'+tabs.map(t=>'<div class="tab '+(codexTab===t?'on':'')+'" data-act="codextab" data-arg="'+t+'">'+
        ({bestiary:'BICHOS',machines:'ENGENHOCAS',radio:'RÁDIO',ach:'SELOS'})[t]+'</div>').join('')+'</div>'+body+
      '<div class="space"></div>'+btn('VOLTAR','back','','small'));
  }

  // ---------- ÁRVORE ----------
  function tree(){
    const s=SaveDB.slot;
    const branches=TREE_BRANCHES.map(b=>{
      const nodes=TREE.filter(n=>n.br===b.id).map(n=>{
        const lvl=SaveDB.nodeLvl(n.id),maxed=lvl>=n.max,cost=SaveDB.costOf(n,lvl);
        const reqOk=!n.req||SaveDB.nodeLvl(n.req)>0;
        const afford=s.oldScrap>=cost;
        return '<div class="node '+(maxed?'max':'')+' '+(reqOk?'':'locked')+'"><h4>'+n.nome+'</h4><small>'+n.desc+'</small>'+
          '<div class="cost"><span class="pips">'+'●'.repeat(lvl)+'○'.repeat(n.max-lvl)+'</span>'+
          (maxed?'<span class="gold">COMPRADO</span>':
            '<span>'+cost+' <button class="btn tiny" data-act="buynode" data-arg="'+n.id+'" '+(afford&&reqOk?'':'disabled')+'>PÔR</button></span>')+
          '</div></div>';
      }).join('');
      return '<div class="branch '+b.id+'"><h3>'+b.nome+'</h3><p>'+b.desc+'</p>'+nodes+'</div>';
    }).join('');

  // ---------- HUD ----------
  function cardLayout(){
    const list=availableMachines();
    const x0=136,w=Math.min(48,Math.floor((W-146)/Math.max(1,list.length))-2),gap=2;
    return list.map((k,i)=>({k,x:x0+i*(w+gap),y:6,w,h:58}));
  }
  function cardAt(x,y){
    if(y>70)return null;
    const hit=cardLayout().find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
    return hit?hit.k:null;
  }
  function drawHUD(g){
    const p=g.map;
    // recurso
    ctx.fillStyle='rgba(8,12,10,.62)';rr(10,6,116,64,4);ctx.fill();
    ctx.fillStyle='#c0503a';rr(20,18,20,12,2);ctx.fill();ctx.fillStyle='#9aa8a0';ctx.fillRect(20,18,20,3);
    ctx.fillStyle='#f0e4bd';ctx.font='bold 23px "Courier New",monospace';ctx.fillText(fmt(g.scrap),46,32);
    ctx.fillStyle='#9aa08a';ctx.font='12px monospace';ctx.fillText(p.resShort,46,44);
    ctx.fillStyle='#7a806a';ctx.font='11px monospace';ctx.fillText('VELHA: '+SaveDB.slot.oldScrap,46,56);
    ctx.fillStyle='#c8b070';ctx.font='11px monospace';ctx.fillText(g.mode==='endless'?'ONDA '+Math.min(g.waves.length,g.survived+1):'ONDA '+(g.survived+1),46,65);
    // cartas
    for(const r of cardLayout()){
      const m=MACH[r.k],cost=machCost(r.k),cool=g.cds&&g.cds[r.k]||0,up=(g.up&&g.up[r.k])||0;
      const can=g.scrap>=cost&&cool<=0&&g.selected!==r.k;
      ctx.fillStyle=g.selected===r.k?'rgba(90,70,30,.92)':'rgba(14,18,16,.78)';rr(r.x,r.y,r.w,r.h,3);ctx.fill();
      ctx.strokeStyle=g.selected===r.k?'#e8c84a':can?'#4a5242':'#333a30';ctx.lineWidth=1.5;ctx.stroke();
      ctx.save();ctx.translate(r.x+r.w/2,r.y+r.h-19);ctx.scale(.36,.36);ctx.globalAlpha=can||g.selected===r.k?1:.45;
      drawMachine({type:r.k,x:0,lane:0,t:g.t,hp:1,maxhp:1,anim:0,act:0,flash:0,_icon:true});ctx.restore();
      ctx.fillStyle=can||g.selected===r.k?'#e8d9a8':'#777c6c';ctx.font='bold 12px monospace';ctx.fillText(r.k==='remover'?'—':cost,r.x+3,r.y+53);
      const short=m.nome.split(' ')[0].toUpperCase().slice(0,7);
      ctx.fillStyle='#a8aa94';ctx.font='9px monospace';ctx.fillText(short,r.x+3,r.y+9);
      if(up){for(let j=0;j<3;j++){ctx.fillStyle=j<up?'#e8c84a':'#39402f';ctx.fillRect(r.x+r.w-8+j*2.4,r.y+3,2,4);}}
      if(cool>0){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(r.x,r.y,r.w,r.h*(cool/m.cd));}
    }
    // status do modo
    if(g.mode==='daily'&&g.dailyMods){ctx.fillStyle='#c8b070';ctx.font='8px monospace';ctx.fillText('DIÁRIO: '+g.dailyMods.map(d=>d.nome).join(' + '),138,72);}
    if(g.shields>0){ctx.fillStyle='#7fb3a6';ctx.font='9px monospace';ctx.fillText('TÁBUAS: '+g.shields,W-120,70);}
    if(g.boss&&!g.bossDeath){
      const b=g.boss;
      ctx.fillStyle='rgba(8,10,8,.72)';rr(W/2-180,3,360,22,3);ctx.fill();
      ctx.fillStyle='#e8d9a8';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText((BOSSES[b.b].nome)+' — FASE '+b.phase,W/2,13);
      ctx.fillStyle='#3a1a16';ctx.fillRect(W/2-170,18,340,4);ctx.fillStyle='#c84a30';ctx.fillRect(W/2-170,18,340*clamp(b.hp/b.maxhp,0,1),4);
      ctx.textAlign='left';
    }
  }
  function drawScene(g){
    // intro de chefe
    const intro=Game.bossIntro;
    if(intro){
      const t=intro.t/intro.dur;
      ctx.fillStyle='rgba(2,3,4,.85)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle=`rgba(120,20,10,${.12+Math.sin(g.t*8)*.04})`;ctx.fillRect(0,H/2-90,W,180);
      ctx.save();ctx.translate(W/2,gy(1)+30);ctx.scale(.9+Math.min(1,t)*.3,.9+Math.min(1,t)*.3);
      const fake={boss:true,b:intro.b,type:intro.b,lane:1,x:W/2,anim:g.t,phase:3,hp:1,maxhp:1,rise:0,inflate:false,act:1,flash:0,revealed:1};
      try{drawBoss(fake);}catch(e){}
      ctx.restore();
      ctx.textAlign='center';ctx.fillStyle='#e8d9a8';ctx.font='bold 30px Impact,sans-serif';
      ctx.fillText(BOSSES[intro.b].nome,W/2,90);
      ctx.fillStyle='#b06a4a';ctx.font='11px monospace';ctx.fillText(BOSSES[intro.b].desc,W/2,112);
      ctx.textAlign='left';
    }
    // aviso de escuro e chefe
    if(g.dark&&g.darkT>0){ctx.fillStyle='rgba(200,230,220,.5)';ctx.font='10px monospace';ctx.fillText('A LUZ NÃO ESTÁ AQUI. HOLOFOTE AINDA ACENDE.',20,H-16);}
    if(g.mode==='boss'&&g.boss){ctx.fillStyle='#8a8f7a';ctx.font='9px monospace';ctx.fillText('MODO CHEFE · '+g.map.nome,W-190,H-16);}
  }

  // ---------- topo ----------
  function updateTopbar(g){
    if(!g||Game.screen==='title'){top.classList.add('hidden');return;}
    top.classList.remove('hidden');
    const tr=TRACKS[g.map.track]||TRACKS.barra;

  // ---------- ações ----------
  function backTo(){
    if(Game.screen==='pause'){pause();return;}
    if(Game.screen==='play'||Game.screen==='shop')return;
    title();
  }
  function bind(){
    document.addEventListener('click',ev=>{
      const el=ev.target.closest('[data-act]');if(!el)return;
      const act=el.getAttribute('data-act'),arg=el.getAttribute('data-arg');
      SFX.ui();
      switch(act){
        case 'pause':Game.pause();break;
        case 'resume':Game.resume();break;
        case 'toggleMute':Game.toggleMute();break;
        case 'title':Game.quitToTitle();title();break;
        case 'maps':maps();break;
        case 'continue':Game.continueCampaign();break;
        case 'slot':SaveDB.setSlot(Number(arg));title();break;
        case 'slots':slots();break;
        case 'newslot':if(arg===null)break;SaveDB.resetSlot(Number(arg));toast('story','SLOT APAGADO. O ZÉ NÃO PERGUNTOU NADA.');slots();break;
        case 'map':Game.startFromOpts({kind:'campaign',map:Number(arg)});break;
        case 'nextmap':Game.startCampaign(clamp(G.mapIndex+1,0,MAPS.length-1));break;
        case 'endlessmenu':endlessMenu();break;
        case 'endless':Game.startFromOpts({kind:'endless',level:Number(arg),map:clamp(SaveDB.slot.campaign,0,5)});break;
        case 'bossmenu':bossMenu();break;
        case 'boss':Game.startFromOpts({kind:'boss',map:Number(arg)});break;
        case 'dailymenu':dailyMenu();break;
        case 'daily':Game.startFromOpts({kind:'daily'});break;
        case 'sandbox':Game.startFromOpts({kind:'sandbox'});break;
        case 'options':Game.paused=true;options();break;
        case 'back':backTo();break;
        case 'codex':Game.paused=true;codex();break;
        case 'codextab':codex(arg);break;
        case 'tree':Game.paused=true;tree();break;
        case 'buynode':Game.buyNode(arg);break;
        case 'help':Game.paused=true;help();break;
        case 'retry':retry();break;
        case 'save':SaveDB.save();toast('ach','SALVO. NÃO QUE VIRE COSTUME.');break;
        case 'offer':Game.chooseOffer(Number(arg));break;
        case 'buyitem':Game.buyShopItem(arg);break;
        case 'ending':Game.finishEnding(arg);break;
      }
    });
    $('radioLamp').addEventListener('click',()=>Game.radioClick());
    document.addEventListener('change',ev=>{
      const el=ev.target;if(!el.getAttribute)return;
      const act=el.getAttribute('data-act');
      if(act==='opt'){
        const k=el.getAttribute('data-arg');
        let v=el.value;if(k==='shake'||k==='cb')v=Number(v);if(k==='font')v=Number(v);
        Game.option(k,v);options();
      }
      if(act==='muteopt'){Snd.init();const o=SaveDB.options;o.mute=Number(el.value);SaveDB.opt('mute',o.mute);Snd.applyVolumes();options();}
    });
    document.addEventListener('input',ev=>{
      const el=ev.target;if(!el.getAttribute||el.getAttribute('data-act')!=='vol')return;
      const k=el.getAttribute('data-arg');Game.option(k,Number(el.value));
      const lab=el.closest('.opt').querySelector('.sub');if(lab)lab.textContent=Math.round(Number(el.value)*100)+'%';
    });
  }
  function retry(){
    if(!G){Game.quitToTitle();return;}
    const mode=G.mode;
    if(mode==='boss')Game.startFromOpts({kind:'boss',map:G.mapIndex});
    else if(mode==='endless')Game.startFromOpts({kind:'endless',level:G.endlessDiff||0,map:G.mapIndex});
    else if(mode==='sandbox')Game.startFromOpts({kind:'sandbox'});
    else if(mode==='daily')Game.startFromOpts({kind:'daily'});
    else Game.startFromOpts({kind:'campaign',map:G.mapIndex});
  }
  bind();

  const api={title,maps,slots,pause,options,codex,tree,help,shop,end,epilogue,ending,
    hideOverlays:hide,updateTopbar,toast,cardAt,drawHUD,drawScene};
  return api;
})();

/* ===== game.js ===== */
/* =====================================================================
   game.js — estado, simulação, input, câmera, progressão e segredos.
   Regra da casa: todo dano é visível, toda morte tem piada, toda onda
   deixa marca permanente na vila.
   ===================================================================== */

let G=null;
const Game={
  screen:'title', paused:false, modal:null,
  runOpts:null, offers:[], shopItems:[],
  cardRects:[], bossIntro:null
};
window.Game=Game;

// ---------------------------------------------------------------------
// Utilidades de estado
// ---------------------------------------------------------------------
function eff(){return SaveDB.eff();}
function isMachUnlocked(k){
  if(!MACH[k])return false;
  if(MACH[k].unlock)return true;
  const e=eff();
  if(e.unlocks&&e.unlocks[k])return true;
  if(e.unlocks&&e.unlocks.estilingue&&(k==='estilingue'||k==='batedeira'))return true;
  if(e.unlocks&&e.unlocks.espelho&&(k==='espelho'||k==='pneu'))return true;
  if(e.unlocks&&e.unlocks.cachorro&&k==='cachorro')return true;
  if(k==='coisa_ze')return SaveDB.slot.campaign>=1;
  for(const u of MAP_UNLOCKS)if(SaveDB.slot.campaign>=u.map&&u.machs.includes(k))return true;
  return false;
}
function machCost(k){const e=eff();return Math.max(1,Math.round(MACH[k].cost*(1-(e.discount||0))));}
function availableMachines(){return MACH_ORDER.filter(isMachUnlocked);}
function machineAt(l,c){return G.machines.find(m=>m.lane===l&&m.col===c);}
function structuresAlive(){return G.structures.flat().filter(s=>s.alive).length;}
function announce(text,kind){if(window.UI)UI.toast(kind||'story',text);}

// ---------------------------------------------------------------------
// Início de partida
// ---------------------------------------------------------------------
Game.titleBackdrop=function(){
  Game.screen='title';
  Game.runOpts=null;
  G=makeState(0,'title');
  G.phaseIdx=0;G.phases=[{type:'idle'}];
  G.ze.say='A maré tá subindo. Ainda bem que eu não sei nadar.';G.ze.sayT=999;
  G.luAtWindow=true;G.toqAlive=true;G.zeHat=false;
};

function makeState(mapIndex,mode,opts){
  const map=MAPS[clamp(mapIndex,0,MAPS.length-1)];
  const e=eff();
  const daily=!!(opts&&opts.daily);
  const dailyMods=(opts&&opts.mods)||[];
  const mods={};
  if(daily)for(const m of dailyMods){for(const k in m)if(k!=='id'&&k!=='nome'&&k!=='desc')mods[k]=m[k];}
  const startRes=daily&&mods.scrap?mods.scrap:(mode==='sandbox'?999999:200+e.startScrap);
  const st={
    mode,map,mapIndex,t:0,scrap:startRes,resMult:(map.resMult||1)*(daily&&mods.res?mods.res:1),
    machines:[],enemies:[],projs:[],pickups:[],parts:[],decals:[],texts:[],winds:[],props:[],deaths:[],hazards:[],
    selected:null,cds:{},phaseIdx:0,phaseT:0,spawnIdx:0,tideT:4,shake:0,flash:0,msg:'',msgT:0,
    over:false,win:false,kills:0,collected:0,destroyed:[],survived:0,
    structures:map.estruturas.map((lane,i)=>lane.map((s,j)=>({...s,alive:true}))),

// ondas de campanha: 3, geradas com identidade do mapa
function makeWaves(st,daily){
  const map=st.map,diff=st.mods.hp||1,speed=st.mods.speed||1;
  const rng=daily?mulberry(hashStr(dayKey()+map.id)):Math.random;
  const pool=st.mods.pool||map.pool;
  const waves=[];
  const counts=daily?[7,13]:[7,13,20];
  for(let w=0;w<(daily?2:3);w++){
    const arr=[];
    let poolW;
    if(w===0) poolW=['baiacu','enguia'];
    else if(w===1) poolW=['baiacu','enguia','caranguejo','ova','polvo','piranha'];
    else poolW=['baiacu','enguia','caranguejo','ova','polvo','piranha','bomba'];
    for(let i=0;i<counts[w];i++){
      const type=poolW[Math.floor(rng()*poolW.length)];
      const lane=Math.floor(rng()*5);
      const spacing=w===0?4.2:(w===1?3.0:2.6);
      const time=i*spacing+rng()*1.6;
      arr.push([time,type,lane,1+w*.12]);
    }
    // integração das 3 novas criaturas conforme especificação
    if(w===1){
      arr.push([30,'polvo',Math.floor(rng()*5),1.1]);
      for(let k=0;k<4;k++)arr.push([30+rng()*2,'piranha',Math.floor(rng()*5),1.1]);
      arr.push([30,'baleia',Math.floor(rng()*5),1]);
    }
    if(w===2){
      arr.push([12,'polvo',Math.floor(rng()*5),1.1]);
      arr.push([14,'polvo',Math.floor(rng()*5),1.1]);
      for(let k=0;k<5;k++)arr.push([18+rng()*4,'piranha',Math.floor(rng()*5),1.1]);
      arr.push([45,'baleia',Math.floor(rng()*5),1]);
    }
    // exclusivo do mapa aparece na segunda onda
    if(w>=1)for(const t of map.extra)arr.push([4+Math.floor(rng()*(counts[w]*2)),t,Math.floor(rng()*5),1.1]);
    if(daily&&st.mods.bossEarly&&w===1)arr.push([counts[w]*2,map.boss,1,1]);
    waves.push(arr.sort((a,b)=>a[0]-b[0]));
  }
  st.enemyHpMult=st.mods.enemyHp||1;st.speedMult=speed;
  return waves;
}
function makeEndlessWave(n,pool,diff){
  const types=(pool||[]).slice();const arr=[];const dur=36+Math.min(14,n*2);
  let count, poolW;
  if(n===0){count=7;poolW=['baiacu','enguia'];}
  else if(n===1){count=13;poolW=['baiacu','enguia','caranguejo','ova','polvo','piranha'];}
  else{count=Math.min(22,9+Math.min(24,n*3));poolW=['baiacu','enguia','caranguejo','ova','polvo','piranha','bomba'];}
  const spc=n===0?4.2:2.6; for(let i=0;i<count;i++)arr.push([i*spc+rnd(0,1.5),pick(poolW),Math.floor(rnd(0,5)),1+Math.min(1,n*.09)]);
  // integração das novas criaturas na Noite Infinita
  if(n>=1){
    arr.push([30,'polvo',Math.floor(rnd(0,5)),1.1]);
    for(let k=0;k<4;k++)arr.push([30+rnd(0,2),'piranha',Math.floor(rnd(0,5)),1.1]);
  }
  if(n>=2){
    arr.push([12,'polvo',Math.floor(rnd(0,5)),1.1]);
    arr.push([14,'polvo',Math.floor(rnd(0,5)),1.1]);
    for(let k=0;k<5;k++)arr.push([18+rnd(0,4),'piranha',Math.floor(rnd(0,5)),1.1]);
    arr.push([45,'baleia',Math.floor(rnd(0,5)),1]);
  }
  if(n>=2 && n%3===2)arr.push([dur*.6,'bento',1,1+n*.07]);
  return arr.sort((a,b)=>a[0]-b[0]);
}
function buildPhases(st){
  if(st.mode==='boss')return[{type:'prep',dur:8,msg:'SÓ VOCÊ E ELE'},
    {type:'bossIntro',dur:2.6},{type:'boss'}];
  if(st.mode==='sandbox'||st.mode==='endless')return[{type:'prep',dur:10,msg:st.mode==='sandbox'?'AREIA LIVRE':'A NOITE NÃO TEM FIM'},
    {type:'wave',n:0},{type:'break'},{type:'wave',n:1}];
  if(st.daily)return[{type:'prep',dur:10,msg:'DESAFIO DO DIA'},{type:'wave',n:0},{type:'break'},{type:'wave',n:1},
    {type:'bossIntro',dur:2.6},{type:'boss'}];
  return[{type:'prep',dur:12,msg:'A MARÉ ESTÁ SUBINDO'},{type:'wave',n:0},
    {type:'break'},{type:'wave',n:1},{type:'break'},{type:'wave',n:2},
    {type:'break'},{type:'prep',dur:15,msg:'RESPIRO'},{type:'bossIntro',dur:2.6},{type:'boss'}];
}

function currentPhase(){return G.phases[G.phaseIdx]||{type:'idle'};}
function announceWave(w){
  const msg='ONDA '+(w+1);
  announce(msg+' — '+(G.mode==='endless'?'SEM FIM':(w===0?'ELES SENTIRAM O CHEIRO':w===1?'TEM MAIS COISA VINDO':'TUDO QUE O MAR TINHA')),'story');
  Snd.setIntensity(Math.min(4,w+1));
  const rm=RADIO.find(r=>r.map===G.mapIndex&&r.wave===w+1);
  if(rm)setTimeout(()=>{if(G&&Game.screen==='play')announce('RÁDIO: '+rm.txt,'radio');},2200);
  if(G.ze.alive&&w>=1){G.ze.say=pick(['Agora vai.','Segura aí.','Não olha pro mar.']);G.ze.sayT=3.4;}
}
function nextPhase(){
  G.phaseIdx++;G.phaseT=0;G.spawnIdx=0;
  const ph=currentPhase();if(!ph){G.phaseIdx--;return;}
  if(ph.type==='wave'){
    if(ph.n>=G.waves.length){
      if(G.mode==='campaign'){G.phases.splice(G.phaseIdx,1,{type:'bossIntro',dur:2.6},{type:'boss'});nextPhase();return;}
      if(G.mode==='endless'||G.mode==='sandbox'){
        const n=G.waves.length;G.waves.push(makeEndlessWave(n,G.map.pool,G.endlessDiff));
        G.phases.splice(G.phaseIdx,1,{type:'break'},{type:'wave',n:n});
        nextPhase();return;
      }
    }
    announceWave(ph.n||0);
  }
  if(ph.type==='break'){openShop();}
  if(ph.type==='bossIntro'){openBossIntro();}
  if(ph.type==='boss'){spawnBoss(G.map.boss,undefined,true);}
}
function advanceFromBreak(){
  const ph=currentPhase();
  if(ph.type==='break'){G.phaseIdx++;G.phaseT=0;G.spawnIdx=0;}
  Game.screen='play';Game.modal=null;UI.hideOverlays();UI.updateTopbar(G);
  Snd.pauseDuck(false);Snd.setIntensity(1);
  const w=currentPhase();
  if(w.type==='wave')announceWave(w.n);
  if(w.type==='bossIntro')openBossIntro();
}
function updatePhase(dt){
  const ph=currentPhase();
  if(!ph||ph.type==='idle')return;
  G.phaseT+=dt;
  if(ph.type==='prep'){if(G.phaseT>=ph.dur)nextPhase();}
  else if(ph.type==='bossIntro'){if(G.phaseT>=ph.dur)nextPhase();}
  else if(ph.type==='wave'){
    const list=G.waves[ph.n]||[];
    // aviso 2s antes da baleia-filhote
    if(G.spawnIdx<list.length && list[G.spawnIdx][1]==='baleia' && !list[G.spawnIdx]._warned && (list[G.spawnIdx][0]-G.phaseT)<=2){
      list[G.spawnIdx]._warned=true;
      const lane=list[G.spawnIdx][2];
      G.baleiaWarn={lane,t:2};
      G.ze.say='OLHA A BALEIA';G.ze.sayT=2.5;announce('OLHA A BALEIA','story');SFX.alarm();
    }
    if(G.baleiaWarn){G.baleiaWarn.t-=dt;if(G.baleiaWarn.t<=0)G.baleiaWarn=null;}
    while(G.spawnIdx<list.length&&list[G.spawnIdx][0]<=G.phaseT){
      const s=list[G.spawnIdx++];
      if(BOSSES[s[1]])spawnBoss(s[1],s[2]);else spawnEnemy(s[1],s[2],undefined,(s[3]||1)*(G.enemyHpMult||1));
    }
    if(G.spawnIdx>=list.length&&!G.enemies.some(e=>!e.neutral)&&!G.boss){G.survived++;nextPhase();}
  }else if(ph.type==='boss'){
    if(G.bossDeath&&G.bossDeath.t>G.bossDeath.dur)completeMap();
  }
}

function isTargetable(e,allowHidden){
  if(!e||e.burrow>0)return false;
  if(e.boss)return true;
  if(ENEMY[e.type]&&ENEMY[e.type].human)return false;
  if(e.neutral)return false;
  if(e.air&&e.lit<=0&&e.grounded<=0)return false;
  if(e.type==='enguia'&&e.dived&&e.lit<=0)return false;
  if(e.type==='fantasma'&&!e.revealed&&e.lit<=0&&!allowHidden)return false;
  if(e.flee)return false;
  return true;
}
function damageEnemy(e,dmg,src){
  if(!e||e.burrow>0)return;
  if(e.neutral)return;
  if(e.boss){damageBoss(e,dmg,src);return;}
  if(ENEMY[e.type].human||e.type==='pescador'){
    e.revealed=1;e.spoke=pick(['Zé?','Meu barco...','Eu não quero machucar.']);e.act=.5;
    addText(e.x,gy(e.lane)-e.r-16,'ELE É GENTE','#f0d0a0');SFX.human();return;
  }
  if(e.type==='agua'&&e.lit<=0&&src!=='boom'&&src!=='fire'){e.revealed=1;addText(e.x,gy(e.lane)-e.r-10,'não é física','#a8c8c8');return;}
  if(e.buff)dmg*=.4;
  if(e.type==='lata'&&src==='toast'){ /* torradeira nem chega a chamar */ }
  e.hp-=dmg;e.flash=.18;e.act=.25;e.revealed=1.2;e.lit=Math.max(e.lit,.4);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e,noChain){
  if(e&&e.type==='baleia')return;
  const i=G.enemies.indexOf(e);if(i<0)return;G.enemies.splice(i,1);
  if(e.type==='mare')return;
  G.kills++;if(e.type!=='baleia'&&e.type!=='pescador')G.collected+=0;
  const y=gy(e.lane);
  const ichor=e.type==='enguia'?'#1b1b22':e.type==='ova'?'#e07a9a':e.type==='lata'?'#6a8a9a':e.type==='polvo'?'#5a3a52':'#5a1a2a';
  stain(e.x+rnd(-8,8),y+rnd(0,10),ichor,e.boss?50:undefined);
  burst(e.x,y-e.r*.8,e.boss?40:6,ichor,140,500,3,.5);
  if(ENEMY[e.type].scrap>0)dropScrap(e.x,y-e.r,Math.round(ENEMY[e.type].scrap*(1+eff().luck)*(G.resMult||1)),true);
  const _swimBack = e.type==='piranha' && !G.enemies.some(o=>o!==e&&o.type==='piranha'&&o.lane===e.lane);
  G.deaths.push({type:e.type,x:e.x,y,lane:e.lane,t:0,dur:deathDur(e.type),dir:Math.random()<.5?-1:1,swimBack:_swimBack});
  SFX.death(e.type);
  if(noChain)return;
  if(e.type==='ova'){for(let k=0;k<3;k++){const l=spawnEnemy('larva',e.lane,e.x+rnd(-20,20));l.kb=rnd(-70,110);}
    addText(e.x,y-20,'PINTINHO? NÃO.','#f0a0c0');}
  else if(e.type==='bomba'){explode(e.x,e.lane,70,100);}
  else if(e.type==='sapo'){const near=G.enemies.filter(o=>o.lane===e.lane&&Math.abs(o.x-e.x)<90)[0];
    if(near){damageEnemy(near,35,'splat');addText(e.x,y-34,'COLO DE ALGUÉM','#c8d070');}}
  else if(e.type==='caranguejo_m'){for(const o of G.enemies)if(o.type==='caranguejo'&&Math.abs(o.x-e.x)<220){o.rage=7;o.speed*=1.5;addText(o.x,gy(o.lane)-40,'VINGANÇA','#e0a040');}}
  else if(e.type==='baleia'){G.zeSilent=1;G.ze.say='...';G.ze.sayT=4;SaveDB.achievement('baleia');announce('O ZÉ NÃO VAI FALAR NESSA ONDA.','story');}
}
function steal(p,e){
  e.carry+=p.v;e.flee=true;e.act=.6;e.revealed=1;
  const i=G.pickups.indexOf(p);if(i>=0)G.pickups.splice(i,1);
  SFX.steal();addText(p.x,p.y-12,'-'+p.v,'#e08080');
}
function explode(x,lane,dmgE,dmgM,big){
  SFX.explode();G.shake=Math.max(G.shake,big?18:10);
  burst(x,gy(lane)-30,big?60:36,'#ffb040',big?460:360,200,rnd(4,9),.6);
  burst(x,gy(lane)-30,big?40:26,'#333',160,-60,rnd(5,10),1.2);
  stain(x,gy(lane),'#1a1410',big?60:46);
  for(const e of [...G.enemies])if(Math.abs(e.lane-lane)<=1&&Math.abs(e.x-x)<COLW*1.6)damageEnemy(e,dmgE,big?'boom':'boom');
  for(const m of [...G.machines])if(Math.abs(m.lane-lane)<=1&&Math.abs(m.x-x)<COLW*1.6&&!m.dead)damageMachine(m,dmgM);
}
function damageBoss(e,dmg,src){
  if(e.b==='mare'){addText(e.x-30,gy(1)-160,'NÃO DÁ','#c8e0d8');return;}
  if(e.inflate)dmg*=.15;
  e.hp-=dmg;e.flash=.16;e.act=.3;
  if(e.hp<=0&&!G.bossDeath){bossDefeated(e);}
}

function placeMachine(k,l,c,freeGift){
  if(!MACH[k]||k==='remover')return false;
  if(machineAt(l,c))return false;
  const discountFree=freeGift||G.sandbox;
  if(!discountFree){
    if(!isMachUnlocked(k)){addText(cx(c),gy(l)-60,'trancado','#c88');return false;}
    if(G.scrap<machCost(k)){addText(cx(c),gy(l)-60,'sucata de menos','#c88');return false;}
    if((G.cds[k]||0)>0)return false;
    G.scrap-=machCost(k);G.cds[k]=MACH[k].cd;
  }
  const hpBonus=1+(eff().machineHp||0)+(G.hpBonus||0);
  const hp=Math.round(MACH[k].hp*hpBonus);
  const m={type:k,lane:l,col:c,x:cx(c),hp,maxhp:hp,t:rnd(0,3),timer:0,anim:0,act:0,flash:0,jam:0,
    variant:k==='coisa_ze'?pick(['torradeira','ventilador','radio','boia','bujao','holofote']):null};
  G.machines.push(m);SFX.place();burst(m.x,gy(l),10,'#8a7a5a',120,400,3,.5);
  SaveDB.seenMach(k);G.placementCount++;
  if(G.sandbox&&G.placementCount>=50)if(SaveDB.achievement('sandbox50'))announce('CONQUISTA: testador de gambiarra','ach');
  if(G.map.id==='cemiterio'&&G.machines.filter(x=>x.type==='geladeira'||x.type==='geladeira_bomba').length>=6&&!G.geladeiraScene){
    G.geladeiraScene=true;SaveDB.achievement('geladeiras');announce('SEIS GELADEIRAS. A DONA LÚ OLHOU. NINGUÉM FALA DISSO.','ach');SFX.laugh();
  }
  return true;
}
function damageMachine(m,d){if(m.dead)return;m.hp-=d;m.flash=.15;m.act=.2;if(m.hp<=0)destroyMachine(m,true);}
function destroyMachine(m,violent){
  if(m.dead)return;m.dead=true;
  if(!G.firstPieceLost){G.firstPieceLost=true;announce('Sua peça caiu. Planta outra ali.','story');}
  const i=G.machines.indexOf(m);if(i>=0)G.machines.splice(i,1);
  for(const e of G.enemies){if(e.eating===m)e.eating=null;if(e.attached===m){e.attached=null;e.grabbed=null;}}
  if(violent){
    SFX.metal();burst(m.x,gy(m.lane)-25,20,'#9a9a8a',220,500,rnd(2,6),.9);
    dropScrap(m.x,gy(m.lane)-25,Math.round(machCost(m.type)*.4),true);
    if(m.type==='bujao')explode(m.x,m.lane,150+40*(G.up.bujao||0),25);
    if(m.type==='coisa_ze'&&m.variant==='bujao')explode(m.x,m.lane,120,20);
    if(m.type==='geladeira_bomba')explode(m.x,m.lane,170,60,true);
  }
}
function upgradeMachine(k){
  if(!UPG[k])return false;
  G.up[k]=Math.min(3,(G.up[k]||0)+1);
  if(k==='geladeira')for(const m of G.machines)if(m.type==='geladeira'){const bonus=Math.round(MACH.geladeira.hp*(1+.6*(G.up[k]-1)));m.hp+=bonus-m.maxhp;m.maxhp=bonus;m.act=.5;}
  for(const m of G.machines)if(m.type===k){m.act=.6;}
  addText(480,300,'+ '+(UPG[k][G.up[k]-1]||''),'#e8c84a');SFX.level();
  announce('ZÉ: enfiei '+UPG[k][G.up[k]-1]+' na '+MACH[k].nome+'.','story');
  return true;
}
function dropScrap(x,y,v,auto){G.pickups.push({x,y,v:Math.max(1,Math.round(v)),auto:!!auto,life:14,t:0,fly:false,vy:auto?-120:0,bob:rnd(0,6)});}
function collect(p){p.fly=true;SFX.pickup();}

// ---------------------------------------------------------------------
// Atualização
// ---------------------------------------------------------------------
function update(dt){
  if(!G)return;
  G.t+=dt;
  // ambiente e cenário continuam vivos mesmo no menu
  for(const d of G.deaths)d.t+=dt;
  G.deaths=G.deaths.filter(d=>d.t<d.dur);
  for(const p of G.props){p.anim+=dt;p.x-=26*dt;}G.props=G.props.filter(p=>p.x>-50);
  for(const w of G.winds){w.x+=w.vx*dt;w.life-=dt;}G.winds=G.winds.filter(w=>w.life>0);
  for(const q of G.parts){q.vx*=Math.exp(-1.5*dt);q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const tx of G.texts){tx.y-=30*dt;tx.life-=dt;}G.texts=G.texts.filter(tx=>tx.life>0);
  for(const s of G.structures)for(const st of s)if(!st.alive&&Math.random()<dt*.6)G.parts.push({x:st===s[0]?58:126,y:gy(G.structures.indexOf(s))-20,vx:rnd(-6,6),vy:rnd(-18,-8),life:rnd(1,2),max:2,color:'rgba(90,85,75,.5)',size:rnd(3,7),g:-8});
  if(G.ze.sayT>0)G.ze.sayT-=dt;
  if(G.toqSayT>0)G.toqSayT-=dt;
  G.toqBoost=Math.sin(G.t*.8)*10;
  G.shake*=Math.exp(-6*dt);G.flash=Math.max(0,G.flash-dt*1.5);G.msgT-=Math.max(0,dt);

  if(Game.screen!=='play'||Game.paused)return;
  if(Game.bossIntro&&Game.bossIntro.t<Game.bossIntro.dur){Game.bossIntro.t+=dt;if(Game.bossIntro.t>=Game.bossIntro.dur){Game.bossIntro=null;if(currentPhase().type==='bossIntro'){G.phaseIdx++;G.phaseT=0;spawnBoss(G.map.boss,undefined,true);}}return;}
  if(G.bossDeath){G.bossDeath.t+=dt;if(G.bossDeath.t>G.bossDeath.dur)completeMap();return;}

  updatePhase(dt);
  G.tideT-=dt;
  if(G.tideT<=0){G.tideT=G.map.weather==='rain'?3.5:6;const l=Math.floor(rnd(0,5));dropScrap(rnd(FIELD_R-60,FIELD_R),gy(l)-20,Math.round(25*(G.resMult||1)),false);}
  G.scrap += 8*dt;
  for(const k in G.cds)G.cds[k]=Math.max(0,G.cds[k]-dt);

  // Zé e NPCs
  if(!G.zeSilent&&G.ze.alive){G.ze.nextSay-=dt;if(G.ze.nextSay<=0){G.ze.say=pick(ZE_FALAS);G.ze.sayT=4;G.ze.nextSay=rnd(16,26);}G.ze.anim+=dt;}
  else G.ze.anim+=dt*.2;
  if(G.luAtWindow&&chance(dt*.05)){G.luTalking=pick(LU_LINES);setTimeout(()=>{if(G)G.luTalking='';},2600);}
  if(G.toqAlive&&chance(dt*.04)){G.toqSay=pick(TOQ_LINES);G.toqSayT=3;}

  updateWeatherMech(dt);
  updateLights(dt);
  updateMachines(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateBossSpecials(dt);
  updateHazards(dt);
  updatePickups(dt);
  updateAmbientAchievements();

  if(G.hitsThisSecond===undefined)G.hitsThisSecond=0;
}
function updateWeatherMech(dt){
  const w=G.map.weather;
  if(w==='rain'){G.fireT=(G.t%12<6)?1:0;}
  else G.fireT=1;
  if(w==='fog')G.fog=true;
  GIF: if(w==='gale'){for(const p of G.projs)p.x-=14*dt;for(const e of G.enemies)e.x-=4*dt;}
  if(w==='ash')G.ash=true;
}
function updateLights(dt){
  for(const e of G.enemies)e.lit=0;
  for(const m of G.machines){
    if(m.jam>0){m.jam-=dt;continue;}
    const isHolo=m.type==='holofote'||(m.type==='coisa_ze'&&m.variant==='holofote');
    if(!isHolo)continue;
    const reach=COLW*(3+.5*(G.up.holofote||0));
    for(const e of G.enemies){
      if(e.lane!==m.lane||e.x<m.x-20||e.x>m.x+reach)continue;
      e.lit=.28;e.slow=Math.max(e.slow,.3);
      if(e.air&&e.grounded<=0){e.air=false;e.grounded=4;e.act=.5;burst(e.x,gy(e.lane)-40,8,'#b8b0a0',120,400,3,.6);}
      if(e.type==='enguia')e.dived=false;
      if(e.type==='tatu')e.digCd=Math.max(e.digCd,1.4);
      if(e.type==='fantasma')e.revealed=Math.max(e.revealed,.4);
      if(e.type==='mariposa'){e.act=.4;damageEnemy(e,10,'light');}
      if(e.type==='agua')e.act=.4;
    }
  }
}
function nearMach(m,type){return G.machines.some(o=>o!==m&&o.lane===m.lane&&o.type===type&&Math.abs(o.x-m.x)<COLW*1.2);}
function updateMachines(dt){
  const slow=G.map.weather==='ash'?1.15:1;
  for(const m of G.machines){
    if(m.dead)continue;
    m.t+=dt;m.anim=Math.max(0,m.anim-dt);m.act=Math.max(0,m.act-dt);m.flash=Math.max(0,m.flash-dt);
    if(m.grabbed!=null){m.grabbed-=dt;if(m.grabbed<=0){destroyMachine(m,true);}continue;}
    if(m.jam>0)continue;
    m.timer+=dt*slow;
    const kind=m.type==='coisa_ze'?m.variant:m.type;
    const up=kind==='coisa_ze'?0:(G.up[kind]||0);
    if(kind==='boia'){
      const every=(9-1.6*up)*(nearMach(m,'ima')?.7:1);
      if(m.timer>every){m.timer=0;m.act=.6;m.anim=.5;dropScrap(m.x+rnd(-24,24),gy(m.lane)-50,25+10*up,false);
        if(m.type==='coisa_ze')dropScrap(m.x,gy(m.lane)-60,30,false);SFX.pop();}
    }else if(kind==='torradeira'){
      const reach=G.map.id==='fog'?W:W;
      const tgt=G.enemies.some(e=>e.lane===m.lane&&e.x>m.x+10&&e.x<reach+10&&isTargetable(e));
      const rate=(1.4-.14*up)*(m.type==='coisa_ze'?1.1:1);
      if(tgt&&m.timer>rate){m.timer=0;m.anim=.3;m.act=.35;SFX.shoot();
        const n=1+(up>=2?1:0);
        for(let i=0;i<n;i++)G.projs.push({x:m.x+16+i*8,y:gy(m.lane)-38,lane:m.lane,vx:330*(G.map.weather==='fog'?.86:1),dmg:(20+5*up)*(1+G.dmgBonus),rot:0,kind:'toast',enemy:false});
      }
    }else if(kind==='lancador_lata'){
      const reach=W;
      const tgt=G.enemies.some(e=>e.lane===m.lane&&e.x>m.x+10&&e.x<reach+10&&isTargetable(e));
      const rate=2.0-.15*up;
      if(tgt&&m.timer>rate){m.timer=0;m.anim=.4;m.act=.4;SFX.metal();
        const n=1+(up>=2?1:0);
        for(let i=0;i<n;i++)G.projs.push({x:m.x+18+i*10,y:gy(m.lane)-40,lane:m.lane,vx:280,dmg:(35+8*up)*(1+G.dmgBonus),rot:0,kind:'lata_proj',enemy:false});
      }
    }else if(kind==='ventilador'){
      if(m.timer>3-.25*up){
        const ahead=G.enemies.filter(e=>e.lane===m.lane&&e.x>m.x&&e.x<m.x+3*COLW&&e.burrow<=0&&!isMachGrabbed(e));
        if(ahead.length){m.timer=0;m.anim=.8;m.act=.8;SFX.gust();
          const doubled=nearMach(m,'radio');
          for(const e of ahead){
            if(e.air){e.air=false;e.grounded=4;e.act=.6;burst(e.x,gy(e.lane)-40,8,'#b8b0a0',120,400,3,.6);}
            const f=e.boss?60:(360+120*up)*(e.hypno>0?2:1);e.kb+=f;e.slow=1.3;
            if(doubled&&!e.boss&&e.type!=='pescador'){e.hypno=Math.max(e.hypno,.8);}
          }
          for(let i=0;i<6;i++)G.winds.push({x:m.x+30,y:gy(m.lane)-rnd(10,55),life:rnd(.5,.9),vx:rnd(300,500)});}
      }
    }else if(kind==='holofote'){
      if(m.timer>2.6){m.timer=0;m.act=.5;SFX.light();}
    }else if(kind==='ima'){
      if(m.timer>1.2){m.timer=0;m.act=.4;const r=COLW*(1.1+.3*up);
        for(const p of G.pickups)if(!p.fly&&Math.abs(p.x-m.x)<r&&Math.abs(p.y-gy(m.lane))<LANE_H)collect(p);}
    }else if(kind==='radio'){
      if(m.timer>11-up){
        const cand=G.enemies.filter(e=>!e.boss&&e.type!=='pescador'&&e.burrow<=0&&!e.flee&&Math.abs(e.x-m.x)<COLW*3.5&&isTargetable(e));
        if(cand.length){m.timer=0;m.act=1;SFX.hypno();
          if(nearMach(m,'radio')){for(const e of cand)if(Math.abs(e.x-m.x)<COLW*2.5){e.hypno=2.2;e.act=1;e.eating=null;}}
          else{const e=cand.sort((a,b)=>a.x-b.x)[0];e.hypno=2.2;e.act=1;e.eating=null;addText(e.x,gy(e.lane)-e.r-22,'OUVINDO RÁDIO','#d8c0e0');}
          if(G.enemies.some(e=>e.type==='pescador'&&Math.abs(e.x-m.x)<COLW*3))redirectPescador();
        }
      }
    }else if(kind==='estilingue'){
      if(m.timer>3.2-.3*up){const tgt=G.enemies.find(e=>e.lane===m.lane&&e.x>m.x+20&&isTargetable(e)&&Math.abs(e.x-m.x)<W);
        if(tgt){m.timer=0;m.act=.5;SFX.can();G.projs.push({x:m.x+10,y:gy(m.lane)-52,lane:m.lane,vx:520,dmg:(45+12*up)*(1+G.dmgBonus),rot:0,kind:'can',silent:true,enemy:false});}}
    }else if(kind==='aspirador'){
      if(m.timer>2.6){const cand=G.enemies.filter(e=>!e.boss&&e.type!=='pescador'&&e.burrow<=0&&e.x>m.x&&e.x<m.x+2*COLW&&ENEMY[e.type]&&ENEMY[e.type].hp<150&&!e.neutral);
        if(cand.length){m.timer=0;m.act=.7;SFX.gust();
          for(const e of cand){e.kb-=140+40*up;e.slow=.8;if(nearMach(m,'bujao'))e.kb-=90;}
          burst(m.x+20,gy(m.lane)-20,8,'rgba(180,200,190,.5)',100,-40,3,.4);}
      }
    }else if(kind==='batedeira'){
      if(m.timer>.6){m.timer=0;m.act=.3;
        for(const e of G.enemies)if(e.lane===m.lane&&e.x>m.x-20&&e.x<m.x+COLW*.9&&isTargetable(e)){damageEnemy(e,9+4*up,'blade');SFX.hit();}
      }
    }else if(kind==='espelho'){
      if(m.timer>.9){m.timer=0;m.act=.4;
        for(const p of G.projs)if(p.enemy&&p.lane===m.lane&&p.x>m.x-40&&p.x<m.x+60){const i=G.projs.indexOf(p);if(i>=0)G.projs.splice(i,1);
          G.projs.push({x:m.x+20,y:p.y,lane:p.lane,vx:380,dmg:18,kind:'mirror',enemy:false});SFX.reflect();break;}
      }
    }else if(kind==='pneu'){
      const burning=G.fireT>0;
      if(m.timer>.7){m.timer=0;m.act=.3;
        if(burning)for(const e of G.enemies)if(e.lane===m.lane&&e.x>m.x-10&&e.x<m.x+(nearMach(m,'ventilador')?2.4:1.4)*COLW)damageEnemy(e,6+3*(G.up.pneu||0),'fire');
      }
    }else if(kind==='aranha'){
      if(m.timer>3.6){const tgt=G.enemies.filter(e=>e.x>m.x+10&&isTargetable(e));
        if(tgt.length){m.timer=0;m.act=.4;SFX.shoot();
          for(let l=0;l<5;l++)G.projs.push({x:m.x+10,y:gy(l)-40,lane:l,vx:420,dmg:(13+4*(G.up.aranha||0))*(1+G.dmgBonus),rot:0,kind:'can',silent:true,enemy:false});}
      }
    }else if(kind==='cachorro'){
      if(m.timer>3.2){const small=G.enemies.filter(e=>e.lane===m.lane&&e.x>m.x&&e.x<m.x+2.2*COLW&&!e.boss&&!e.neutral&&ENEMY[e.type]&&ENEMY[e.type].hp<120);
        if(small.length){m.timer=0;m.act=.6;SFX.lata();for(const e of small)e.kb+=120;G.dogSay=.6;}
        if(G.enemies.some(e=>e.type==='pescador'&&Math.abs(e.x-m.x)<COLW*2.5)&&(nearMach(m,'radio')||chance(.35)))redirectPescador();
      }
    }
  }
  for(const m of G.machines)if(m.act===0&&m.jam<=0)m.jam=0;
  if(G.machines.length!==G.machines.filter(m=>!m.dead).length)G.machines=G.machines.filter(m=>!m.dead);
}
function isMachGrabbed(e){return e.grabbed!=null;}
function redirectPescador(){
  const e=G.enemies.find(o=>o.type==='pescador'&&!o.saved);
  if(!e)return;
  e.saved=true;e.flee=true;e.spoke='...obrigado.';e.speed=34;e.act=1;
  addText(e.x,gy(e.lane)-80,'ELE LEMBROU','#a8d8b0');SFX.human();
  if(SaveDB.achievement('pescador'))announce('CONQUISTA: ele lembrou. Ninguém morreu dessa vez.','ach');
  dropScrap(e.x,gy(e.lane)-30,80,true);
  G.ze.say='Ele ainda sabia voltar.';G.ze.sayT=4;
}
function damageBossByFire(e){}
function updateEnemies(dt){
  for(let n=G.enemies.length-1;n>=0;n--){
    const e=G.enemies[n];if(!e)continue;
    if(e.hp<=0){if(e.boss)continue;G.enemies.splice(n,1);continue;}
    e.anim+=dt;e.flash=Math.max(0,e.flash-dt);e.slow=Math.max(0,e.slow-dt);e.act=Math.max(0,e.act-dt);
    e.revealed=Math.max(0,e.revealed-dt);e.grounded=Math.max(0,e.grounded-dt);e.reflectT=Math.max(0,e.reflectT-dt);
    if(e.jump!==undefined&&e.jump>0)e.jump=Math.max(0,e.jump-dt);
    if(e.boss){updateBossBase(e,dt);continue;}
    if(e.type==='enguia'){e.diveT+=dt;e.dived=e.lit<=0&&(e.diveT%3.5)>2.2;}
    if(e.type==='caranguejo')e.buff=G.enemies.some(o=>o!==e&&o.type==='caranguejo'&&o.lane===e.lane&&Math.abs(o.x-e.x)<240);
    if(e.rage>0){e.rage-=dt;}
    if(e.type==='piranha')e.school=G.enemies.filter(o=>o.type==='piranha'&&Math.abs(o.x-e.x)<200&&o.lane===e.lane).length;
    if(e.type==='polvo'&&e.attached)continue;
    if(e.type==='tatu'){
      if(e.burrow>0){e.burrow-=dt;
        if(!e.dug&&e.burrow<.6){e.dug=true;const from=e.x;e.x-=rnd(2,3)*COLW;
          burst(from,gy(e.lane),14,'#6a5a3a',150,400,4,.6);burst(e.x,gy(e.lane),14,'#6a5a3a',150,-100,4,.8);
          stain(e.x,gy(e.lane)+4,'#3a2e1e',26);SFX.dig();}
        if(e.burrow<=0){e.burrow=0;e.digCd=rnd(5,8);e.act=.5;}
        continue;}
      e.digCd-=dt;if(e.digCd<=0&&e.x>VX+2*COLW&&e.lit<=0){e.burrow=1.1;e.dug=false;e.act=.6;e.digCd=999;}
    }
    if(e.type==='fantasma'){
      for(const p of [...G.pickups])if(!p.fly&&!p.auto&&Math.abs(p.x-e.x)<40&&Math.abs(p.y-(gy(e.lane)-20))<80){steal(p,e);break;}
      if(e.flee){e.x+=e.speed*1.7*dt;if(e.x>SPAWN_X){G.enemies.splice(n,1);addText(W-100,gy(e.lane)-50,'LEVOU '+e.carry,'#e08080');}continue;}
    }
    if(e.type==='pescador'&&e.saved){e.x+=e.speed*dt;if(e.x>W+60){G.enemies.splice(n,1);dropScrap(200,gy(1)-40,40,true);}continue;}
    if(e.hypno>0){e.hypno-=dt;e.eating=null;e.x+=13*dt;e.act=.3;continue;}
    if(e.type==='passageiro'){
      e.switchT-=dt;
      if(e.switchT<.8)e.switching=true;
      if(e.switchT<=0){e.switchT=rnd(4,7);e.switching=false;let nl=Math.floor(rnd(0,5));if(nl===e.lane)nl=(nl+1)%3;e.lane=nl;e.y=gy(nl);SFX.lata();burst(e.x,gy(nl),6,'#8a9a8a',100,300,3,.4);}
    }
    if(e.type==='sapo'){
      e.jumpCd-=dt;if(e.jumpCd<=0){e.jumpCd=rnd(3,4.6);e.jump=.5;e.x-=2*COLW;e.act=.6;SFX.pop();}
    }
    if(e.type==='gaivota_r'&&e.grabbed!=null){e.x+=e.speed*dt;continue;}
    if(e.kb!==0){e.x+=e.kb*dt;e.kb*=Math.exp(-5*dt);if(Math.abs(e.kb)<2)e.kb=0;e.x=Math.min(e.x,SPAWN_X+40);}
    // contato com máquinas
    let blocked=null;
    if(!(e.air&&e.grounded<=0)&&e.type!=='baleia'&&e.type!=='pescador'&&!e.saved){
      for(const m of G.machines){if(m.lane!==e.lane||m.dead)continue;
        if(e.x-e.r*.8<=m.x+22&&e.x>=m.x-8){blocked=m;break;}}
    }
    if(blocked){
      if(e.type==='polvo'){e.attached=blocked;blocked.jam=4.5;e.act=1;SFX.metal();G.ze.say='Ele desligou a geladeira.';G.ze.sayT=3;continue;}
      if(e.type==='gaivota_r'){e.grabbed=blocked;blocked.grabbed=1.6;e.act=1;SFX.steal();G.ze.say='Tá levando a peça.';G.ze.sayT=3;continue;}
      if(blocked.type==='bujao'){destroyMachine(blocked,true);continue;}
      if(e.type==='bomba'){explode(e.x,e.lane,40,110);killEnemy(e,true);G.enemies.splice(G.enemies.indexOf(e),1);continue;}
      if(e.type==='baleia'){damageMachine(blocked,30*dt);e.eating=blocked;continue;}
      e.eating=blocked;e.biteT+=dt;e.act=.2;
      damageMachine(blocked,e.dps*(e.buff?.7:1)*dt);
      if(e.biteT>.55){e.biteT=0;SFX.bite();burst(blocked.x,gy(e.lane)-30,3,'#8a8a7a',80,400,2,.4);}
    }else{
      e.eating=null;
      const sp=e.speed*(e.slow>0?.45:1)*(e.type==='piranha'&&e.school>=3?2.0:1)*(1+(e.rage?0:0));
      e.x-=sp*dt;
      if(e.type==='baleia'&&e.x<VX+20){G.enemies.splice(n,1);G.ze.say='Ela não sabia.';G.ze.sayT=4;
        addText(VX+20,gy(e.lane)-60,'ELA NÃO SABIA.','#e8d9a8');
        if(SaveDB.achievement('baleia_ok')){}announce('A BALEIA-FILHOTE PASSOU. NINGUÉM MORREU.','radio');continue;}
      if(e.x<VX+8&&e.type!=='baleia')breach(e);
    }
  }
  G.enemies=G.enemies.filter(e=>e);
}
function updateBossBase(e,dt){
  e.anim+=dt;e.flash=Math.max(0,e.flash-dt);e.phaseT+=dt;e.actT-=dt;
  const frac=e.hp/e.maxhp;
  const wantPhase=e.b==='gerente'?clamp(1+Math.floor((1-frac)*7),1,7):frac>.66?1:frac>.33?2:3;
  if(wantPhase>e.phase){e.phase=wantPhase;e.act=1;G.shake=12;SFX.enter(e.b);Snd.setIntensity(4);
    addText(e.x,gy(e.lane)-140,'FASE '+e.phase,'#e8c84a');G.flash=.4;}
  if(e.b==='mare'){e.rise=clamp(e.phaseT/120,0,1)*100;e.hp=e.maxhp;e.actT-=dt;
    if(e.actT<=0){e.actT=rnd(2.2,3.4);const lane=Math.floor(rnd(0,5));const t=pick(['baiacu','enguia','piranha','polvo','agua','fantasma']);spawnEnemy(t,lane,SPAWN_X+rnd(0,80),1.2);}
    e.maeT=(e.maeT||0)+dt;if(e.maeT>120){bossDefeated(e);}return;}
  // movimento e ataque corpo a corpo
  if(e.breachCd>0)e.breachCd-=dt;
  let blocked=null;
  for(const m of G.machines){if(m.lane!==e.lane||m.dead)continue;if(e.x-e.r*.8<=m.x+24&&e.x>=m.x-10){blocked=m;break;}}
  if(blocked){e.eating=blocked;blocked.grabbed=undefined;damageMachine(blocked,e.dps*dt*.5);
    if(e.b==='bento'&&!e.ate&&blocked.maxhp){e.ate=1;addText(blocked.x,gy(e.lane)-70,'ELE MORDEU A PEÇA','#e0a040');}
  }else{e.eating=null;if(!(e.b==='faroleiro'&&e.phase>=2))e.x-=e.speed*dt*(e.phase>=3?1.25:1);}
  if(e.x<VX+40){breach(e);e.x=SPAWN_X-30;}
}
function updateBossSpecials(dt){
  const e=G.boss;if(!e||G.bossDeath)return;
  if(e.b==='bento'){
    if(e.actT<=0){e.actT=e.phase>=3?4:6.5;SFX.laugh();
      if(e.phase>=2){const lane=Math.floor(rnd(0,5));spawnEnemy(pick(['bomba','caranguejo','baiacu']),lane,SPAWN_X,1);}
      if(e.phase>=3){G.projs.push({x:e.x-40,y:gy(e.lane)-50,lane:e.lane,vx:-280,dmg:25,kind:'scrap',enemy:true,rot:0});}
      addText(e.x,gy(e.lane)-130,e.phase>=3?'TÁ COM FOME?':'CHAMA O REFORÇO','#e0a040');
    }
  }else if(e.b==='faroleiro'){
    e.darkCd-=dt;
    if(e.darkCd<=0&&e.phase>=1){e.darkCd=e.phase>=3?8:12;
      G.dark=!G.dark;G.darkT=G.dark?4:0;SFX.bell(220,Snd.ctx?Snd.ctx.currentTime:0,.08,2);
      announce(G.dark?'A LUZ APAGOU. HOLOFOTE AINDA ACENDE.':'A LUZ VOLTOU.','story');
      if(e.phase>=3){G.darkT=6;G.dark=true;setTimeout(()=>{if(G)G.dark=false;},6000);}
      for(const m of G.machines)if(m.type==='holofote'||(m.type==='coisa_ze'&&m.variant==='holofote'))G.up.holofote=Math.max(G.up.holofote,0);
    }
    if(G.dark)G.darkT=Math.max(0,G.darkT-dt);
    if(G.darkT<=0&&G.dark&&e.phase<3)G.dark=false;
    if(e.actT<=0){e.actT=e.phase>=2?4:6;SFX.enter('mariposa');
      spawnEnemy(pick(['mariposa','agua','gaivota']),Math.floor(rnd(0,5)),SPAWN_X,1);
      if(e.phase>=2){const l=Math.floor(rnd(0,5));e.lane=l;e.x=SPAWN_X-20;burst(e.x,gy(l),10,'rgba(255,240,180,.5)',100,0,3,.6);}
    }
  }else if(e.b==='maquinista'){
    e.actT-=dt;
    if(e.actT<=0){e.actT=e.phase>=3?4:6.5;SFX.steam();
      const lane=Math.floor(rnd(0,5));G.hazards.push({kind:'train',lane,t:0,warn:2.6,dur:1.6,dmg:60,phase:e.phase});
      announce('O TRILHO '+(lane+1)+' VAI PASSAR. SAI DAÍ.','story');}
    if(chance(dt*.25))spawnEnemy(pick(['passageiro','piranha']),Math.floor(rnd(0,5)),SPAWN_X,1);
  }else if(e.b==='peixe_mae'){
    e.inflT-=dt;
    if(e.inflT<=0){e.inflate=!e.inflate;e.inflT=e.inflate?3:4;if(e.inflate)addText(e.x,gy(e.lane)-160,'INCHOU. NÃO BATE.','#e8d070');}
    e.actT-=dt;
    if(e.actT<=0){e.actT=e.phase>=3?2.6:4;SFX.plop();
      for(let i=0;i<(e.phase>=3?3:2);i++)spawnEnemy(pick(['baiacu','piranha']),Math.floor(rnd(0,5)),SPAWN_X,1.1);}
  }else if(e.b==='gerente'){
    e.actT-=dt;
    if(e.actT<=0){e.actT=3.4;SFX.steam();
      const lane=Math.floor(rnd(0,5));G.hazards.push({kind:'conveyor',lane,t:0,warn:1.6,dur:2.2,dmg:30,phase:e.phase});
      spawnEnemy(pick(['lata','polvo','fantasma']),lane,SPAWN_X,1);
      announce('REUNIÃO NA LINHA '+(lane+1)+'. PAUTA: VOCÊ.','story');
    }
  }
}
function updateProjectiles(dt){
  for(let i=G.projs.length-1;i>=0;i--){
    const p=G.projs[i];p.x+=p.vx*dt;p.rot=(p.rot||0)+dt*10;
    if(p.x>W+30||p.x<VX-40){G.projs.splice(i,1);continue;}
    if(p.enemy||p.kind==='mirror'){
      if(p.enemy){
        const m=G.machines.filter(o=>o.lane===p.lane&&Math.abs(o.x-p.x)<22).sort((a,b)=>b.x-a.x)[0];
        if(m){G.projs.splice(i,1);damageMachine(m,20);SFX.hit();burst(p.x,p.y,5,'#d8a85a',120,400,2,.3);}
      }
      continue;
    }
    const hit=G.enemies.find(e=>e.lane===p.lane&&Math.abs(e.x-p.x)<e.r*.95&&isTargetable(e,p.silent));
    if(hit){
      G.projs.splice(i,1);
      if(hit.type==='lata'&&p.kind==='toast'){
        hit.reflectT=.6;hit.act=.6;
        G.projs.push({x:hit.x-10,y:p.y,lane:p.lane,vx:-300,dmg:p.dmg,kind:'toast',enemy:true,rot:0});
        SFX.reflect();addText(hit.x,p.y-20,'DEVOLVO','#c8e0e8');burst(hit.x,p.y,6,'#d8e8f0',160,300,3,.4);
      }else{
        damageEnemy(hit,p.dmg, p.kind==='can'?'can':'toast');SFX.hit();burst(p.x,p.y,5,p.kind==='can'?'#9aa8a0':'#d8a85a',120,400,2,.3);
        if(G.mode==='boss'||hit.boss)SFX.hit();
      }
    }
  }
}
function updateHazards(dt){
  for(let i=G.hazards.length-1;i>=0;i--){
    const h=G.hazards[i];h.t+=dt;
    if(h.t>=h.warn&&h.t<h.warn+h.dur){
      if(!h.hit){h.hit=true;SFX.crash();G.shake=16;
        for(const m of G.machines)if(m.lane===h.lane)damageMachine(m,h.dmg);
        for(const e of G.enemies)if(e.lane===h.lane&&!e.boss&&e.type!=='baleia'&&e.type!=='pescador')damageEnemy(e,h.kind==='train'?90:25,'boom');}
    }
    if(h.t>h.warn+h.dur+.3)G.hazards.splice(i,1);
  }
}
function updatePickups(dt){
  for(let i=G.pickups.length-1;i>=0;i--){
    const p=G.pickups[i];p.t+=dt;
    if(p.fly){const tx=56,ty=42,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
      if(d<18){G.scrap+=p.v;G.collected+=p.v;G.pickups.splice(i,1);continue;}
      p.x+=dx/d*950*dt;p.y+=dy/d*950*dt;continue;}
    if(p.auto){p.vy+=400*dt;p.y+=p.vy*dt;if(p.t>.6)collect(p);continue;}
    p.x-=4*dt;p.life-=dt;
    if(p.life<=0){G.pickups.splice(i,1);burst(p.x,p.y,4,'#6a8a8a',60,200,2,.4);}
  }
}

function breach(e){
  if(e.boss&&e.b==='mare')return;
  const idx=G.enemies.indexOf(e);if(idx>=0&&!e.boss)G.enemies.splice(idx,1);
  G.shake=20;G.flash=1;SFX.crash();
  burst(120,gy(e.lane)-30,40,'#6a5a4a',260,500,rnd(3,7),1);
  const lane=G.structures[e.lane];
  const s=lane.find(s=>s.alive);
  if(G.shields>0&&!e.boss){G.shields--;announce('A TÁBUA DE RESERVA SEGUROU. UMA.','story');addText(150,gy(e.lane)-60,'TÁBUA','#e8c84a');if(e.x<W)G.enemies.push(e);return;}
  if(G.sandbox){announce('SANDBOX: nada quebrou. O ZÉ AGRADECE.','radio');if(!e.boss)G.enemies.push(e);e.x=SPAWN_X;return;}
  if(s){s.alive=false;G.destroyed.push(s.nome);G.ze.say=pick(['Ai.','Já era.','Não.','Levanta, Zé.']);G.ze.sayT=3;
    if(!G.firstVillageLost){G.firstVillageLost=true;announce('A vila sentiu isso. Não deixa de novo.','story');}
    announce(s.msg,'story');}
  else if(G.ze.alive&&G.structures[e.lane].every(s=>!s.alive)){
    G.ze.alive=false;
    burst(50,gy(1)-30,30,'#7a1a2a',220,500,undefined,1);stain(50,gy(1),'#5a1a2a',30);
    announce('PERDEMOS O ZÉ.','story');
  }
  if(e.boss&&e.b==='bento'&&!G.ze.alive){}
  if(G.structures.flat().every(s=>!s.alive)&&!G.ze.alive)endRun(false);
  else if(!G.ze.alive)endRun(false);
}
function bossDefeated(e){
  if(G.bossDeath)return;
  const idx=G.enemies.indexOf(e);if(idx>=0)G.enemies.splice(idx,1);
  if(G.boss===e)G.boss=null;
  G.enemies=G.enemies.filter(o=>o.boss?false:true);
  G.bossDeath={b:e.b,x:Math.min(e.x,W-120),y:gy(e.lane),lane:e.lane,t:0,dur:deathDur(e.b)};
  G.deaths.push({type:e.b,x:Math.min(e.x,W-120),y:gy(e.lane),lane:e.lane,t:0,dur:deathDur(e.b)});
  SFX.death(e.b);G.shake=20;G.flash=.6;Snd.setIntensity(1);
  G.kills++;dropScrap(e.x,gy(e.lane)-40,120,true);G.zeHat=(e.b==='bento');
  if(e.b==='mare'){SaveDB.achievement('maré');}
  if(e.b==='faroleiro'&&!G.machines.some(m=>m.type==='holofote'))SaveDB.achievement('sem_farol');
  announce('ACABOU. UM DELES, PELO MENOS.','story');
}
function completeMap(){
  if(Game.screen==='end')return;
  const loss=10-structuresAlive();
  const stars=loss===0?3:loss<=2?2:1;
  const base=Math.round((55+stars*30+G.kills*.5+G.survived*8)*(1+(eff().metaBonus||0)/100));
  const meta=G.mode==='sandbox'?0:base;
  if(meta)SaveDB.addScrap(meta);
  if(G.mode==='campaign'){
    SaveDB.setStars(G.mapIndex,99,stars);
    SaveDB.unlockMap(Math.min(MAPS.length-1,G.mapIndex+1));
    SaveDB.record('campaign',{});
    SaveDB.finishRun({kills:G.kills,time:G.t});
  }else if(G.mode==='daily'){SaveDB.recordDaily(G.survived);SaveDB.finishRun({kills:G.kills,time:G.t});}
  else SaveDB.finishRun({kills:G.kills,time:G.t});
  Snd.save&&0;
  SaveDB.save();
  const summary={win:true,mode:G.mode,mapIndex:G.mapIndex,mapName:G.map.nome,kills:G.kills,time:G.t,stars,meta,
    survived:G.survived,lost:G.structures.flat().filter(s=>!s.alive).map(s=>s.nome)};
  Game.screen='end';
  if(G.mode==='campaign'&&G.mapIndex===MAPS.length-1)setTimeout(()=>UI.epilogue(),900);
  else UI.end(summary);
}
function endRun(win){
  if(Game.screen==='end'||G.over)return;
  G.over=true;G.win=win;
  const stars=win?3:Math.max(0,structuresAlive()>=2?1:0);
  const meta=G.mode==='sandbox'?0:Math.round((10+G.kills*.4+G.survived*5)*(1+(eff().metaBonus||0)/100));
  if(meta)SaveDB.addScrap(meta);
  SaveDB.finishRun({kills:G.kills,time:G.t});
  SaveDB.save();
  if(G.mode==='endless'){SaveDB.record('endless',G.survived);}
  Snd.setIntensity(0);
  Game.screen='end';
  UI.end({win:false,mode:G.mode,mapIndex:G.mapIndex,mapName:G.map.nome,kills:G.kills,time:G.t,stars,meta,
    survived:G.survived,lost:G.structures.flat().filter(s=>!s.alive).map(s=>s.nome)});
}

function openShop(){
  Snd.setIntensity(0);Snd.pauseDuck(true);
  Game.screen='shop';
  if(G.repairBank>0){G.repairBank--;const dead=G.structures.flat().find(s=>!s.alive);if(dead){dead.alive=true;announce('REBOQUE: '+dead.nome+' VOLTOU. MAL.','story');}}
  const offers=[];
  const locked=availableMachines().filter(k=>false);
  const notOwned=MACH_ORDER.filter(k=>!isMachUnlocked(k)&&k!=='coisa_ze'&&k!=='remover');
  if(notOwned.length)offers.push({kind:'unlock',k:pick(notOwned)});
  const ups=MACH_ORDER.filter(k=>isMachUnlocked(k)&&UPG[k]&&(G.up[k]||0)<3&&k!=='coisa_ze'&&k!=='remover');
  if(ups.length)offers.push({kind:'up',k:pick(ups)});
  offers.push({kind:'scrap'});
  offers.push({kind:'repair'});
  offers.push({kind:'heal'});
  const chosen=[];for(const o of shuffle(offers)){if(!chosen.some(c=>c.kind===o.kind))chosen.push(o);if(chosen.length>=(eff().extraOffer?4:3))break;}
  Game.offers=chosen;
  Game.shopItems=[
    {id:'repair',nome:'REBOCAR UMA PAREDE',desc:'Conserta uma estrutura caída. Fica torta.',cost:90},
    {id:'heal',nome:'GRAXA NAS PEÇAS',desc:'Cura todas as engenhocas e +10% de dano nesta partida.',cost:120},
    {id:'shield',nome:'TÁBUA DE RESERVA',desc:'Barra a próxima invasão. Só uma.',cost:80}
  ];
  Game.zeGiftPending=true;
  UI.shop();
  // presente do Zé, uma vez por partida
  if(!G.zeGiftGiven){
    G.zeGiftGiven=true;
    const k=pick(MACH_ORDER.filter(x=>x!=='remover'&&x!=='coisa_ze'));
    const free=[];for(let l=0;l<5;l++)for(let c=0;c<COLS;c++)if(!machineAt(l,c))free.push([l,c]);
    if(free.length){const [l,c]=pick(free);placeMachine(k,l,c,true);
      announce('O ZÉ MONTou '+MACH[k].nome.toUpperCase()+' SOZINHO E SAIU. NÃO PERGUNTA.','ach');}
  }
}

  else if(o.kind==='scrap'){G.scrap+=150;addText(60,50,'+150','#e8c84a');SFX.cash();}

function canvasPos(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height};}
function onCanvasDown(ev){
  if(Game.screen!=='play'||Game.paused||!G||G.over)return;
  const p=canvasPos(ev);
  if(ev.button===2){G.selected=null;return;}
  // segredos: Zé, Toquinho, botas, cão
  if(Math.hypot(p.x-46,p.y-(gy(1)-50))<30){Game.zeClick();return;}
  if(G.toqAlive&&Math.hypot(p.x-(70+Math.sin(G.t*.6)*22),p.y-(gy(2)-24))<26){Game.toqClick();return;}
  if(G.props.length&&Math.hypot(p.x-G.props[0].x,p.y-gy(G.props[0].lane))<34){Game.bootsClick();return;}
  // sucata primeiro
  for(const k of G.pickups){if(!k.fly&&!k.auto&&Math.hypot(k.x-p.x,k.y-p.y)<30){collect(k);return;}}
  // cartas
  if(p.y<86){const k=UI.cardAt(p.x,p.y);if(k){
    if(!isMachUnlocked(k)){announce('O ZÉ AINDA NÃO TROUXE ISSO.','story');return;}
    G.selected=G.selected===k?null:k;SFX.ui();}return;}
  const c=Math.floor((p.x-VX)/COLW),l=Math.floor((p.y-LANE_Y0)/LANE_H);
  if(c<0||c>=COLS||l<0||l>4){G.selected=null;return;}
  if(G.selected==='remover'){
    const m=machineAt(l,c);if(m){const v=Math.round(machCost(m.type)*.25);destroyMachine(m,false);G.scrap+=v;
      addText(m.x,gy(l)-60,'+'+v,'#9ab');SFX.metal();G.cabraCount++;}
    G.selected=null;return;
  }
  if(G.selected){
    const k=G.selected;
    const ok=placeMachine(k,l,c);
    if(ok&&!ev.shiftKey)G.selected=null;
    if(ok)SFX.place();
  }
}
window.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if(Game.screen==='shop')return;
    if(Game.screen==='play'&&G)G.selected=null;
    if(Game.screen==='pause')Game.resume();
    return;
  }
  if(ev.key==='p'||ev.key==='P'){if(Game.screen==='play')Game.pause();else if(Game.screen==='pause')Game.resume();return;}
  if(ev.key==='m'||ev.key==='M'){Game.toggleMute();return;}
  if(G&&Game.screen==='play'){
    const list=availableMachines();const n=parseInt(ev.key);
    if(n>=1&&n<=9&&list[n-1])G.selected=list[n-1];
  }
});
canvas.addEventListener('contextmenu',ev=>ev.preventDefault());
canvas.addEventListener('mousedown',onCanvasDown);
canvas.addEventListener('mousemove',ev=>{const p=canvasPos(ev);Game.mouse=p;});

// ---------------------------------------------------------------------
// Desenho
// ---------------------------------------------------------------------
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!G){return;}
  ctx.save();
  const shake=SaveDB.options.shake?G.shake:0;
  if(shake>.4)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBackground(G.map,G,G.t);
  drawDecals(G);
  drawVillage(G,G.t);
  // colocação
  if(G.selected&&Game.screen==='play'&&Game.mouse){
    const c=Math.floor((Game.mouse.x-VX)/COLW),l=Math.floor((Game.mouse.y-LANE_Y0)/LANE_H);
    if(c>=0&&c<COLS&&l>=0&&l<5){
      const free=!machineAt(l,c),can=G.scrap>=machCost(G.selected);
      ctx.fillStyle=free&&can?'rgba(200,220,120,.12)':'rgba(220,80,60,.14)';ctx.fillRect(VX+c*COLW,LANE_Y0+l*LANE_H,COLW,LANE_H);
      ctx.strokeStyle='rgba(220,220,180,.25)';ctx.setLineDash([6,6]);
      for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(VX+i*COLW,LANE_Y0+l*LANE_H);ctx.lineTo(VX+i*COLW,LANE_Y0+(l+1)*LANE_H);ctx.stroke();}
      ctx.setLineDash([]);
      if(free&&G.selected!=='remover'){ctx.globalAlpha=.45;drawMachine({type:G.selected,x:cx(c),lane:l,t:G.t,hp:1,maxhp:1,anim:0,act:0,flash:0});ctx.globalAlpha=1;}
    }
  }
  // luz do holofote e ímã
  for(const m of G.machines){
    if(m.type==='holofote'||(m.type==='coisa_ze'&&m.variant==='holofote')){
      const reach=COLW*(3+.5*(G.up.holofote||0)),y0=gy(m.lane)-40;
      const grd=ctx.createLinearGradient(m.x,0,m.x+reach,0);
      grd.addColorStop(0,`rgba(255,240,170,${.12+Math.sin(G.t*9)*.02})`);grd.addColorStop(1,'rgba(255,240,170,0)');
      ctx.fillStyle=grd;ctx.beginPath();ctx.moveTo(m.x+20,y0);ctx.lineTo(m.x+reach,y0-70);ctx.lineTo(m.x+reach,y0+64);ctx.closePath();ctx.fill();
    }
    if((m.type==='ima')&&Math.sin(G.t*4)>0){
      ctx.strokeStyle='rgba(180,220,255,.3)';ctx.lineWidth=1.2;ctx.setLineDash([4,6]);
      for(const p of G.pickups)if(!p.fly&&Math.abs(p.x-m.x)<COLW*1.4){ctx.beginPath();ctx.moveTo(m.x,gy(m.lane)-26);ctx.lineTo(p.x,p.y);ctx.stroke();}
      ctx.setLineDash([]);
    }
  }
  for(let l=0;l<5;l++){
    for(const m of G.machines)if(m.lane===l)drawMachine(m);
    for(const p of G.props)if(p.lane===l)drawProp(p);
    const es=G.enemies.filter(e=>e.lane===l&&!e.boss).sort((a,b)=>b.x-a.x);
    for(const e of es)drawEnemy(e);
    for(const d of G.deaths)if(d.lane===l&&!BOSSES[d.type])drawDeath(d);
    if(G.boss&&G.boss.lane===l&&!G.bossDeath)drawEnemy(G.boss);
  }
  for(const d of G.deaths)if(BOSSES[d.type])drawBossDeath({...d,b:d.type});
  for(const p of G.projs)drawProjectile(p);
  for(const h of G.hazards)drawHazard(h);
  for(const p of G.pickups)drawPickup(p,G);
  drawParticles(G);
  drawWeather(G,G.t);
  if(G.baleiaWarn){const bw=G.baleiaWarn; if(Math.sin(G.t*12)>0){ctx.fillStyle='#e8d9a8';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText('🐋 BALEIA',cx(2),LANE_Y0+bw.lane*LANE_H+40);ctx.textAlign='left';}}
  if(G.dark&&G.darkT>0){ctx.fillStyle='rgba(2,4,8,.55)';ctx.fillRect(0,0,W,H);}
  ctx.restore();
  const grd=ctx.createRadialGradient(W/2,H/2,H*.42,W/2,H/2,H*.98);
  grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(1,'rgba(8,6,3,.72)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  if(Game.screen==='play'||Game.screen==='pause'){UI.drawHUD(G);UI.drawScene(G);}
}
function drawHazard(h){
  const y=LANE_Y0+h.lane*LANE_H;
  if(h.t<h.warn){
    ctx.fillStyle=`rgba(255,${60+Math.sin(h.t*20)*40},30,${.25+Math.sin(h.t*14)*.15})`;
    ctx.fillRect(VX,y,SPAWN_X-VX,LANE_H);
    ctx.fillStyle='#f0e0a0';ctx.font='bold 13px monospace';ctx.fillText(h.kind==='train'?'APITO. SAIA DO TRILHO.':'ESTEIRA EM MOVIMENTO',VX+320,y+60);
  }else{
    const p=(h.t-h.warn)/h.dur;
    if(h.kind==='train'){
      const x=lerp(SPAWN_X,VX-200,Math.min(1,p*1.3));
      ctx.fillStyle='#1a1c1a';ctx.fillRect(x-160,y+22,320,84);
      ctx.fillStyle='#3a4038';ctx.fillRect(x-140,y+34,280,30);
      ctx.fillStyle='#e8c84a';ctx.beginPath();ctx.arc(x+120,y+52,10,0,7);ctx.fill();
      ctx.fillStyle='#0e100e';for(let i=0;i<4;i++)ctx.beginPath(),ctx.arc(x-100+i*60,y+100,18,0,7),ctx.fill();
      ctx.fillStyle='rgba(200,220,200,.25)';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(x-120+i*50,y-10-Math.sin(p*20+i)*10,10,0,7);ctx.fill();}
    }else{
      ctx.fillStyle='rgba(200,120,40,.5)';ctx.fillRect(VX,y+h%1,SPAWN_X-VX,LANE_H);
      for(let i=0;i<8;i++){ctx.fillStyle='#8a7a5a';ctx.fillRect(VX+(i*120+(h.t*140)%120),y+40+((h.t*80)%80),50,14);}
    }
  }
}
function drawProp(p){
  const y=gy(p.lane),step=Math.sin(p.anim*5);
  ctx.fillStyle='#2a2a30';ctx.fillRect(p.x-22+step*5,y-14,16,14);ctx.fillRect(p.x+4-step*5,y-14,16,14);
  ctx.fillRect(p.x-26+step*5,y-4,10,4);ctx.fillRect(p.x-step*5,y-4,10,4);
  ctx.fillStyle='#5a1a2a';ctx.fillRect(p.x-18,y-18,12,4);ctx.fillRect(p.x+6,y-18,12,4);
}

// ---------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);draw();}catch(err){console.error('MARÉ PODRE:',err);}
  requestAnimationFrame(loop);
}
Game.needAudio=function(){Snd.init();Snd.resume();Snd.applyVolumes();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Game.screen==='play')Game.pause();});

// arranque
document.body.classList.toggle('cb',!!SaveDB.options.cb);
document.documentElement.style.setProperty('--fs',SaveDB.options.font||1);
document.body.classList.toggle('lowshake',!SaveDB.options.shake);
SaveDB.ensureAll();
Game.titleBackdrop();
UI.title();
requestAnimationFrame(loop);

</script>
</body>
